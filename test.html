<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>shared.js 테스트</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; line-height: 1.7; }
  pre { background: #1b1a17; color: #e8e4d8; padding: 16px; border-radius: 10px; overflow-x: auto; font-size: 0.82rem; }
  button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
  h2 { font-size: 1rem; margin: 24px 0 8px; }
  .ok { color: #2f7d5f; font-weight: 700; }
  .fail { color: #c23b2e; font-weight: 700; }
</style>
</head>
<body>
  <h1>shared.js 테스트</h1>
  <p>결과는 아래와 <b>F12 → Console</b> 양쪽에 표시됩니다.</p>
  <p><button onclick="clearPremiumCache(); location.reload();">캐시 비우고 다시 실행</button></p>

  <h2>USDT — getUsdtPremiumData()</h2>
  <pre id="usdt">불러오는 중...</pre>

  <h2>BTC — getBtcPremiumData()</h2>
  <pre id="btc">대기 중...</pre>

<script src="shared.js"></script>
<script>
  function render(el, lines, checks) {
    el.innerHTML = lines.join('\n') + '\n\n' + checks.map(function (c) {
      return '<span class="' + (c[1] ? 'ok">PASS' : 'fail">FAIL') + '</span>  ' + c[0];
    }).join('\n');
  }

  var sorted = function (ds) {
    return ds.every(function (d, k) { return k === 0 || ds[k-1] < d; });
  };

  var usdtEl = document.getElementById('usdt');
  var btcEl  = document.getElementById('btc');

  var t0 = performance.now();
  getUsdtPremiumData({
    onProgress: function (n, phase) {
      usdtEl.textContent = phase === 'fx' ? '환율 가져오는 중...' : '업비트 일봉 ' + n + '개 확보...';
    }
  }).then(function (data) {
    console.log('USDT', data);
    var n = data.dates.length, i = n - 1;
    var premium = (data.usdtPrice[i] - data.fxRate[i]) / data.fxRate[i] * 100;

    render(usdtEl, [
      '기간   : ' + data.dates[0] + ' ~ ' + data.dates[i] + '  (' + n + '일)',
      '소요   : ' + ((performance.now() - t0) / 1000).toFixed(1) + '초',
      '최신   : usdtPrice ' + data.usdtPrice[i] + '원 / fxRate ' + data.fxRate[i] + '원',
      '프리미엄 : ' + (premium >= 0 ? '+' : '') + premium.toFixed(2) + '%'
    ], [
      ['형식 {dates, usdtPrice, fxRate} 3개 키만', JSON.stringify(Object.keys(data)) === '["dates","usdtPrice","fxRate"]'],
      ['배열 길이 일치', n === data.usdtPrice.length && n === data.fxRate.length],
      ['200개 초과 (페이지네이션 동작)', n > 200],
      ['날짜 오름차순 정렬', sorted(data.dates)],
      ['빈 값 없음', data.usdtPrice.every(Number.isFinite) && data.fxRate.every(Number.isFinite)]
    ]);

    // BTC 이어서
    var t1 = performance.now();
    return getBtcPremiumData({
      onProgress: function (n, phase) {
        btcEl.textContent = phase === 'foreign' ? '해외 BTC/USD ' + n + '개 확보...'
                          : phase === 'fx' ? '환율 가져오는 중...'
                          : '업비트 일봉 ' + n + '개 확보...';
      }
    }).then(function (d) {
      console.log('BTC', d);
      var m = d.dates.length, j = m - 1;
      var conv = d.foreignUsd[j] * d.fxRate[j];
      var prem = (d.btcPrice[j] - conv) / conv * 100;

      render(btcEl, [
        '기간   : ' + d.dates[0] + ' ~ ' + d.dates[j] + '  (' + m + '일)',
        '소요   : ' + ((performance.now() - t1) / 1000).toFixed(1) + '초',
        '출처   : ' + d.foreignSource,
        '최신   : btcPrice ' + d.btcPrice[j].toLocaleString() + '원',
        '         foreignUsd $' + d.foreignUsd[j].toLocaleString() + ' × fxRate ' + d.fxRate[j],
        '         환산가 ' + Math.round(conv).toLocaleString() + '원',
        '프리미엄 : ' + (prem >= 0 ? '+' : '') + prem.toFixed(2) + '%'
      ], [
        ['foreignUsd 존재 (김프 계산 가능)', Array.isArray(d.foreignUsd)],
        ['배열 길이 4개 모두 일치', m === d.btcPrice.length && m === d.foreignUsd.length && m === d.fxRate.length],
        ['2000일 초과', m > 2000],
        ['날짜 오름차순 정렬', sorted(d.dates)],
        ['빈 값 없음', d.btcPrice.every(Number.isFinite) && d.foreignUsd.every(Number.isFinite)],
        ['프리미엄 상식 범위 (-20%~+60%)', prem > -20 && prem < 60]
      ]);
    });
  }).catch(function (err) {
    console.error(err);
    (usdtEl.textContent.indexOf('PASS') === -1 ? usdtEl : btcEl)
      .innerHTML = '<span class="fail">실패</span>  ' + err.message;
  });
</script>
</body>
</html>
