# 네이버 검색어 트렌드를 매일 받아 naver_trend.json 을 갱신한다.
#
# 놓아둘 위치: 레포 루트의 .github/workflows/naver-trend.yml
#
# 준비물 — GitHub 레포의 Settings → Secrets and variables → Actions 에서 등록
#   NCP_API_KEY_ID   : NAVER API HUB 인증 정보의 Client ID
#   NCP_API_KEY      : NAVER API HUB 인증 정보의 Client Secret
#
# 주의: 예약 실행(schedule)은 기본 브랜치에서만 동작한다.
#       이 파일이 main 에 있어야 매일 자동으로 돈다.

name: 네이버 검색어 트렌드 갱신

on:
  schedule:
    # UTC 00:10 = KST 09:10. 데이터랩은 전날 값이 아침에 확정되므로 그 뒤에 받는다.
    # 정각(분 0)은 전 세계 워크플로가 몰려 실행이 밀리거나 건너뛰어질 수 있어 10분을 비켜 둔다.
    - cron: '10 0 * * *'
  workflow_dispatch:   # Actions 탭에서 수동으로도 돌릴 수 있게

# 결과 파일을 커밋해야 하므로 쓰기 권한이 필요하다
permissions:
  contents: write

# 앞선 실행이 끝나기 전에 또 돌지 않도록
concurrency:
  group: naver-trend
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 레포 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 검색어 트렌드 받아오기
        env:
          NCP_API_KEY_ID: ${{ secrets.NCP_API_KEY_ID }}
          NCP_API_KEY: ${{ secrets.NCP_API_KEY }}
        run: python3 fetch_naver_trend.py

      - name: 바뀐 내용이 있으면 커밋
        run: |
          if [ -z "$(git status --porcelain naver_trend.json)" ]; then
            echo "변경 없음 — 커밋하지 않습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add naver_trend.json
          git commit -m "chore: 네이버 검색어 트렌드 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          git push