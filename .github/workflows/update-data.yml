name: Update Kimchi Premium Data

on:
  schedule:
    # 매일 UTC 00:00 = 한국시간(KST) 오전 9:00
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run update_data.py
        run: python backend/update_data.py

      - name: Commit and push changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/current.json data/history.json
          if git diff --cached --quiet; then
            echo "변경 사항 없음 - 커밋을 건너뜁니다."
          else
            git commit -m "chore: update kimchi premium data ($(date -u +'%Y-%m-%d'))"
            # 커밋·푸시 사이에 원격이 앞서갈 수 있으므로(다른 push와의 경합),
            # 실패하면 최신 main 위로 리베이스해 몇 번 재시도한다.
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              echo "push 실패 — 원격과 다시 맞추고 재시도합니다 ($i/5)"
              git fetch origin main
              git rebase origin/main
              sleep $((RANDOM % 5 + 1))
            done
          fi
