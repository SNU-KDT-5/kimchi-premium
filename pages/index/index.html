<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIMPLOG</title>
  <!-- SVG는 최신 브라우저용, 나머지는 Safari 탭 미리보기 등 SVG를 안 쓰는 곳을 위한 폴백 -->
  <link rel="icon" href="../../assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="../../assets/face-smile.svg">
  <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/shared.css">
  <link rel="preload" as="image" href="../../assets/%EA%B9%80%ED%94%84%EB%A1%9C%EA%B7%B8%20%EC%8B%9C%EC%9E%91%20%EB%B0%B0%EA%B2%BD-%EC%8B%9C%EC%9E%91%ED%99%94%EB%A9%B4.jpg">
  <!--
    ============================================================
    온보딩 — 김프로그 스크롤 스토리
    ============================================================
    스크롤 진행도(0~1) 하나로 전부 굴러갑니다.

      인사 구간   : 김프로그가 화면 가운데 크게, 말풍선이 하나씩 교체
      이동 구간   : 좌표축이 뜨고 김프로그가 구석으로 이동하며 작아짐
      걷기 구간   : 시세선(검정) 위를 뛰어가며 빨간 선을 만듦

    그래프 구조
      · 검은 선 = 해외 코인 시세.  김프로그가 밟고 있는 "땅"입니다.
      · 접시 위 김치 크기 = 김프.  KIMP_SERIES 로 정하며 시세와 따로 움직입니다.
      · 빨간 선 = 국내 코인 시세 (해외 시세 + 김프).  김치 꼭대기 높이를 그대로
        이어 그리므로, 김치가 클수록 검은 선에서 더 높이 떠오릅니다.
        김프로그가 지나온 만큼만 그려집니다.
      · 끝점에 도착하면 범례 → 김프 화살표 → 두 선 사이 채우기 순으로 켜집니다.

    말풍선
      · SAYS 배열 하나로 관리. 화면에는 언제나 하나만 뜹니다.
      · 김프로그 머리 위를 따라다니며, 화면 밖으로 나가지 않게 잡아줍니다.

    마스코트
      · 스크롤 중에는 뛰는 그림, 멈추면 서 있는 그림으로 바뀝니다.
      · 접시/김치 좌표는 이미지에서 직접 잰 값입니다(FROGS, KIMCHI_ANCHOR).
        그림을 교체하면 이 값만 다시 재면 됩니다.

    김프랫 이야기 (마지막 장면)
      · 스크롤이 끝까지 오면 김프랫이 반짝이는 보따리를 들고 기다립니다.
        보따리를 눌러야 출발하고, 그 뒤로는 저절로 흘러갑니다.
        (출발만 사용자가 끊고, 단계마다 클릭할 필요는 없습니다)
      · 화면 아무 데나 누르면(Space/Enter/→ 도 같음) 지금 대사를 건너뜁니다.
        반짝이는 보따리는 '여기를 봐라'는 표시이지, 유일한 클릭 지점이 아닙니다.
      · '건너뛰기'는 포돌이 경고 바로 앞으로 보냅니다.
        경고와 '절대 따라하지 마세요'는 어떤 경로로도 지나칠 수 없습니다(MIN_DWELL).
      · 걸리는 시간 — 가만히 두면 약 29초, 눌러 넘기면 12~16초.
        속도는 SPEED / MOVE_MS / LAP_MS / LAPS 와 sayBeat 의 hold 값으로 조절합니다.
      · 스크롤을 다시 위로 올리면 처음 상태로 돌아가, 내려오면 다시 재생됩니다.

    · 데이터 fetch 없음. 두 곡선 모두 예시 값입니다.
    · 색상/spacing/radius는 shared.css 토큰만 사용.
    ============================================================
  -->
  <style>
    body { padding-bottom: var(--sp-12); }

    /* ── 시작화면 ────────────────────────────────────────────
       전체 화면을 덮지 않고 그래프 카드 안에 들어간다. 그래서 크기·모서리·그림자를
       카드에서 그대로 물려받고, 위 네비와 아래 '스크롤해서 따라와'도 그대로 보인다.
       그림에 그려진 '시작하기' 는 그대로 두고, 그 위에 투명한 진짜 버튼만 겹친다
       (키보드·스크린리더가 통과해야 하므로). 위치는 그림에서 직접 잰 값이다. */
    .kf-start {
      position: absolute; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: var(--sp-2); padding: var(--sp-3);
      background: var(--panel); border-radius: var(--r-lg);
      cursor: pointer; transition: opacity .45s ease;
    }
    .kf-start.is-out { opacity: 0; pointer-events: none; }

    /* 그림을 감싸는 상자가 그림에 딱 맞아야, 버튼을 비율로 얹을 수 있다 */
    .kf-start-art { position: relative; display: block; line-height: 0; }
    .kf-start-art img { display: block; max-width: 100%; max-height: 100%; border-radius: var(--r-md); }

    /* 그림 속 '시작하기' 위에 정확히 포개는 투명 버튼.
       위치·크기는 그림에서 직접 잰 값(캡션을 잘라낸 972px 높이 기준)이라
       화면 크기가 달라져도 그림 속 버튼과 그대로 포개진다.
       마우스를 올리면 초록으로 물들고 테두리가 생긴다 — 그림에 그려진
       글자는 그대로 두고 배경만 덮으므로 어느 크기에서도 읽힌다. */
    .kf-start-go {
      position: absolute; left: 49.86%; top: 94.14%; transform: translate(-50%, -50%);
      width: 18.47%; height: 9.88%;
      background: transparent; border: 0; border-radius: var(--r-pill);
      cursor: pointer; font-size: 0; color: transparent;
      box-shadow: inset 0 0 0 0 rgba(63, 161, 94, 0);
      transition: background-color .15s ease, box-shadow .15s ease;
    }
    .kf-start-go:hover, .kf-start-go:focus-visible {
      background: rgba(63, 161, 94, 0.30);
      box-shadow: inset 0 0 0 3px var(--frog);
    }

    /* 시작화면이 떠 있는 동안에는 아래 '스크롤해서 따라와' 를 감춘다.
       아직 스크롤할 때가 아니라서다. render() 가 is-off 를 매번 다시 계산하므로
       JS 로 끄면 곧바로 되살아난다 — 그래서 CSS 로 눌러 둔다. */
    .kf-chart-wrap.is-start ~ .kf-scroll-hint { opacity: 0; pointer-events: none; }

    /* ③ 소리를 켜라고 권하는 한 줄. 소리를 켜면 사라진다 */
    .kf-start-tip {
      display: inline-flex; align-items: center; gap: var(--sp-2); flex: none;
      font-size: 0.78rem; font-weight: 700; color: var(--mut);
      transition: opacity .25s ease;
    }
    .kf-start-tip.is-off { opacity: 0; }
    .kf-start-tip svg { width: 15px; height: 15px; display: block; }
    .kf-start-tip svg path { fill: none; stroke: currentColor; stroke-width: 1.9;
                             stroke-linecap: round; stroke-linejoin: round; }
    .kf-start-tip .spk { fill: currentColor; stroke-width: 1.4; }

    /* 시작화면이 떠 있는 동안에는 소리 토글을 배너 오른쪽 위로 데려온다.
       (평소엔 shared.css 대로 화면 좌하단에 고정돼 있다) */
    .sound-fab.in-start {
      position: absolute; left: auto; bottom: auto;
      right: var(--sp-4); top: var(--sp-4); z-index: 11;
    }
    /* 세로 화면에서는 16:9 그림이 길쭉한 카드 안에서 위아래 여백을 크게 남긴다.
       시작화면이 떠 있는 동안만 카드를 그림 높이에 맞춰 줄이고, 시작하면 되돌린다.
       (카드는 스크롤 스토리가 계속 쓰는 자리라 영구히 줄이면 안 된다) */
    @media (max-aspect-ratio: 1/1) {
      .kf-chart-wrap.is-start { flex: none; margin-top: auto; margin-bottom: auto; }
      .kf-chart-wrap.is-start .kf-start { position: relative; inset: auto; }
      .kf-chart-wrap.is-start .kf-chart { position: absolute; inset: 0; }
    }

    @media (prefers-reduced-motion: reduce) { .kf-start { transition: none; } }

    /* 인트로 전용: 맨 위에서는 nav를 배경에 녹여 존재감을 줄이고,
       스크롤을 내리면 다시 배경/구분선이 떠오르게 함 */
    /* nav.js 는 <nav class="topnav"> 를 #topnav-root 안에 넣는데, sticky 는 부모 안에서만
       붙어 있는다. 그 부모의 높이가 nav 높이와 똑같아서 조금만 내려도 같이 밀려 나간다.
       그래서 부모 쪽을 붙여 둔다. (shared.css 는 건드리지 않는다) */
    #topnav-root { position: sticky; top: 0; z-index: 100; }
    .topnav { background: transparent; border-bottom-color: transparent; transition: background-color .25s ease, border-color .25s ease, box-shadow .25s ease; }
    .topnav.scrolled { background: var(--panel); border-bottom-color: var(--border); box-shadow: var(--shadow-sm); }

    /* 인트로(스크롤 전) 배경이 투명해서, 이때만 탭 글자를 옅게 눌러 존재감을 줄인다.
       스크롤해서 nav가 배경을 되찾으면 다른 페이지와 같은 톤으로 돌아온다 */
    .topnav:not(.scrolled) .topnav-tab { color: var(--dim); transition: color .25s ease, background-color .25s ease; }
    .topnav:not(.scrolled) .topnav-tab:hover { color: var(--mut); }
    .topnav:not(.scrolled) .topnav-tab.active { color: var(--mut); background: transparent; font-weight: 600; }

    /* 김프랫의 첫 두 대사를 스크롤로 넘기느라 이 장면만 길다 (980 → 1120vh) */
    .kf-scrolly { position: relative; height: 1120vh; }
    .kf-scrolly2 { height: 520vh; }
    .kf-scrolly3 { height: 820vh; }
    .kf-scrolly4 { height: 460vh; }
    .kf-scrolly5 { height: 560vh; }

    /* 56px = shared.css의 .topnav-inner 높이 */
    .kf-stage {
      position: sticky; top: calc(56px + var(--sp-3));
      height: calc(100vh - 56px - var(--sp-8)); min-height: 400px;
      display: flex; flex-direction: column;
    }
    @supports (height: 100svh) {
      .kf-stage { height: calc(100svh - 56px - var(--sp-8)); }
    }

    /* 그래프는 대시보드의 카드와 같은 흰 판 위에 올린다 */
    .kf-chart-wrap {
      position: relative; flex: 1; min-height: 0;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--r-lg); box-shadow: var(--shadow-md);
      overflow: hidden;
    }
    .kf-chart { width: 100%; height: 100%; display: block; overflow: visible; }

    /* ── 말풍선 (한 번에 하나, 김프로그를 따라다님) ── */
    .kf-say {
      position: absolute; left: 0; top: 0; z-index: 3;
      max-width: min(340px, 78%);
      background: var(--panel); border: 1.5px solid var(--text);
      border-radius: var(--r-xl); padding: var(--sp-3) var(--sp-5);
      font-size: 0.95rem; font-weight: 700; line-height: 1.75; text-align: center;
      box-shadow: var(--shadow-sm);
      transition: opacity .22s ease, transform .22s ease;
    }
    .kf-say:after {
      content: ""; position: absolute; width: 13px; height: 13px;
      left: var(--tail-x, 50%); bottom: -8px; margin-left: -7px;
      background: var(--panel);
      border-left: 1.5px solid var(--text); border-bottom: 1.5px solid var(--text);
      transform: rotate(-45deg);
    }
    .kf-say.is-hidden { opacity: 0; transform: translateY(-5px); }
    /* 얼굴 아래에 붙을 때는 꼬리가 위를 향한다 */
    .kf-say.is-up:after { bottom: auto; top: -8px; transform: rotate(135deg); }
    .kf-say .kimp { color: var(--accent); }
    .kf-say .frog { color: var(--frog); }
    .kf-say .big { font-size: 1.15rem; letter-spacing: -0.01em; }

    /* ── 그래프 ── */
    .kf-axis { stroke: var(--text); stroke-width: 2.5; stroke-linecap: round; fill: none; }
    .kf-axis-label { fill: var(--dim); font-size: 22px; font-family: 'Pretendard', sans-serif; font-weight: 700; }
    .kf-line-price { fill: none; stroke: var(--text); stroke-width: 3.5; stroke-linecap: round; }
    .kf-line-kimp { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .kf-fade { transition: opacity .4s ease; }

    /* 두 선 사이 = 김프. 설명 구간에서 켜진다 */
    .kf-gap-fill { fill: var(--accent); fill-opacity: 0.16; }
    .kf-arrow { stroke: var(--accent); stroke-width: 3; fill: none; }
    .kf-arrow-head { fill: var(--accent); }
    .kf-arrow-label { fill: var(--accent); font-family: 'Pretendard', sans-serif; font-size: 30px; font-weight: 800; }
    .kf-legend-mark { stroke-width: 5; stroke-linecap: round; }
    .kf-legend-mark.dom { stroke: var(--accent); }
    .kf-legend-mark.abr { stroke: var(--text); }
    .kf-legend-text { fill: var(--text); font-family: 'Pretendard', sans-serif; font-size: 28px; font-weight: 700; }

    /* 거래소 패널 속 작은 그래프는 0.3배로 줄어들어 선이 실오라기처럼 얇아진다.
       non-scaling-stroke 로 축소에서 빼내고, 화면 픽셀로 굵기를 직접 준다. */
    #miniAbroad path, #miniDomestic path { vector-effect: non-scaling-stroke; }
    #miniAbroad .kf-axis, #miniDomestic .kf-axis { stroke-width: 1.8; }
    #miniAbroad .kf-line-price, #miniDomestic .kf-line-price { stroke-width: 2.2; }
    #miniAbroad .kf-line-kimp, #miniDomestic .kf-line-kimp { stroke-width: 2.6; }

    /* ── 마지막 장면: 거래소 두 곳 + 은행 + 김프랫 ── */
    .kf-logo { opacity: 0.85; }
    /* 김프랫 이름 색 — 캐릭터의 보라를 따온 값 (shared.css 토큰엔 없는 색) */
    .kf-say .rat { color: #7a4fa3; }
    .kf-panel-label { fill: var(--mut); font-family: 'Pretendard', sans-serif; font-size: 26px; font-weight: 700; }
    .kf-scene2 { pointer-events: none; }
    .kf-scene2.is-on { pointer-events: auto; }

    /* 김프랫의 보따리 — 크고 밝게 반짝여서 눈이 여기로 오게 한다.
       (보따리는 이야기의 주인공이다. 갈 때마다 커지고, 누르면 빨리 감긴다) */
    /* 레이더처럼 퍼지는 링 둘. 반 박자 엇갈려 돌아서 쉬는 순간이 없다.
       보따리를 덮지 않도록 채우기 없이 테두리만 쓴다 */
    .kf-bag-ring {
      fill: none; stroke: var(--amber); stroke-width: 5; opacity: 0;
      transform-box: fill-box; transform-origin: center;
      animation: kf-bag-ring 1.6s ease-out infinite;
    }
    .kf-bag-ring-b { animation-delay: .8s; }
    /* 흰 테두리를 획 뒤로 깔아, 어떤 그림 위에서도 별이 묻히지 않게 한다 */
    .kf-spark {
      fill: var(--amber); stroke: #fff; stroke-width: 2.4; paint-order: stroke;
      transform-box: fill-box; transform-origin: center;
    }
    .kf-spark-a { animation: kf-twinkle 1.2s ease-in-out infinite; }
    .kf-spark-b { animation: kf-twinkle 1.2s ease-in-out .3s infinite; }
    .kf-spark-c { animation: kf-twinkle 1.2s ease-in-out .6s infinite; }
    .kf-spark-d { animation: kf-twinkle 1.2s ease-in-out .9s infinite; }
    /* 완전히 꺼지지 않는다 — 별 넷이 늘 보이면서 밝기만 돌아가며 오르내린다 */
    @keyframes kf-twinkle {
      0%, 100% { opacity: .35; transform: scale(0.55) rotate(-20deg); }
      45%      { opacity: 1;   transform: scale(1.3) rotate(10deg); }
    }
    @keyframes kf-bag-ring {
      0%   { opacity: 0;   transform: scale(0.5); }
      18%  { opacity: .95; transform: scale(0.72); }
      100% { opacity: 0;   transform: scale(1.55); }
    }
    /* 보따리가 커지는 순간 — 링이 퍼지고 반짝이가 흩어진다 */
    .kf-pop-ring { fill: none; stroke: var(--amber); stroke-width: 9; opacity: 0; }
    .kf-pop-bit { fill: var(--amber); stroke: #fff; stroke-width: 2; opacity: 0; }
    .kf-pop.is-on .kf-pop-ring { animation: kf-pop-ring .62s ease-out; }
    .kf-pop.is-on .kf-pop-bit { animation: kf-pop-bit .62s ease-out; }
    @keyframes kf-pop-ring {
      0%   { opacity: 1;  transform: scale(0.2); }
      55%  { opacity: .8; }
      100% { opacity: 0;  transform: scale(2.4); }
    }
    @keyframes kf-pop-bit {
      0%   { opacity: 0; transform: translateY(0) scale(0.2); }
      15%  { opacity: 1; transform: translateY(-14px) scale(1.15); }
      100% { opacity: 0; transform: translateY(-74px) scale(0.55); }
    }

    /* 보따리를 눌러야 하는 순간에만 손가락 커서가 되고, 반짝임도 빨라진다 */
    .kf-hot { fill: transparent; cursor: default; }
    #bagG.is-press .kf-hot { cursor: pointer; }
    #bagG.is-press .kf-bag-ring { animation-duration: 1.05s; stroke-width: 6; }

    /* 보따리가 커지는 순간 — 그림이 한 번 튀어오른다.
       그림만 소리 없이 교체되면 '커졌다'가 눈에 안 걸린다. 발밑을 축으로 눌렀다 편다. */
    .rat-sprite.is-grow {
      transform-box: fill-box; transform-origin: 50% 100%;
      animation: kf-bag-grow .38s cubic-bezier(.2, .9, .3, 1.4);
    }
    @keyframes kf-bag-grow {
      0%   { transform: scale(1, 1); }
      35%  { transform: scale(1.16, 1.20); }
      62%  { transform: scale(0.98, 0.96); }
      100% { transform: scale(1, 1); }
    }

    /* 판 순간 보따리 위로 떠오르는 '+김프'.
       보따리가 커지는 폭이 단계당 7~10% 뿐이라, 크기 지각에만 맡기지 않는다. */
    .kf-gain {
      font-family: 'Pretendard', sans-serif; font-size: 34px; font-weight: 800;
      fill: var(--accent); text-anchor: middle; opacity: 0; pointer-events: none;
      /* 지폐·김치가 알록달록해서 그냥 얹으면 묻힌다. 흰 테두리를 획 뒤에 깐다 */
      stroke: #fff; stroke-width: 7; stroke-linejoin: round; paint-order: stroke;
      transform-box: fill-box; transform-origin: 50% 100%;
    }
    .kf-gain.is-on { animation: kf-gain 1s ease-out; }
    @keyframes kf-gain {
      0%   { opacity: 0; transform: translateY(8px) scale(0.75); }
      18%  { opacity: 1; transform: translateY(-6px) scale(1.12); }
      35%  { opacity: 1; transform: translateY(-14px) scale(1); }
      100% { opacity: 0; transform: translateY(-52px) scale(1); }
    }

    /* 김프랫 이야기 조작 — 이야기는 알아서 흐르고, 이 둘로 앞질러 간다 */
    .kf-skip {
      position: absolute; right: var(--sp-3); bottom: var(--sp-3); z-index: 5;
      font-family: inherit; font-size: 0.76rem; font-weight: 700; color: var(--dim);
      background: var(--panel); border: 1px solid var(--border);
      border-radius: var(--r-pill); padding: var(--sp-2) var(--sp-4);
      cursor: pointer; box-shadow: var(--shadow-sm);
      transition: color .2s ease, border-color .2s ease, opacity .5s ease;
    }
    .kf-skip:hover { color: var(--text); border-color: var(--dim); }
    .kf-tap-hint {
      position: absolute; left: var(--sp-3); bottom: var(--sp-3); z-index: 5;
      font-size: 0.74rem; font-weight: 600; color: var(--dim);
      pointer-events: none; transition: opacity .5s ease;
    }
    /* 그림(SVG)은 장식이라 스크린리더에서 감춰져 있다. 그래서 '보따리를 누른다'를
       실제로 할 수 있는 진짜 버튼을 따로 둔다. 평소엔 눈에 안 보이다가 탭으로
       초점이 오면 나타난다 — 건너뛰기 링크와 같은 방식. */
    .kf-a11y-press {
      position: absolute; left: var(--sp-3); bottom: 54px; z-index: 6;
      font-family: inherit; font-size: 0.78rem; font-weight: 700;
      color: var(--frog); background: var(--panel);
      border: 1px solid var(--frog); border-radius: var(--r-pill);
      padding: var(--sp-2) var(--sp-4); cursor: pointer; white-space: nowrap;
      clip-path: inset(50%);
    }
    .kf-a11y-press:focus-visible { clip-path: none; }
    .kf-a11y-press.is-hidden { display: none; }

    /* 출발을 기다리는 동안에는 '눌러라'가 또렷해야 한다 */
    .kf-tap-hint.is-call { color: var(--frog); font-weight: 700; }
    .kf-skip.is-hidden, .kf-tap-hint.is-hidden { opacity: 0; pointer-events: none; }

    /* 마지막 후레쉬 — 가운데에서 조그맣게 시작해 화면을 덮는다 */
    .kf-flash {
      position: fixed; inset: 0; z-index: 60; display: none;
      align-items: center; justify-content: center; pointer-events: none;
    }
    .kf-flash.is-on { display: flex; }
    .kf-flash img { width: 34vmax; height: auto; will-change: transform, opacity; }
    .kf-flash.is-on img { animation: kf-flash 1.4s ease-in forwards; }
    .kf-flash.is-on.no-img { background: #fff; animation: kf-flash-plain 1.4s ease-in forwards; }
    @keyframes kf-flash {
      0%   { transform: scale(0.05); opacity: 0; }
      12%  { opacity: 0.85; }
      65%  { transform: scale(4.5); opacity: 0.9; }
      100% { transform: scale(7); opacity: 0; }
    }
    @keyframes kf-flash-plain {
      0%, 100% { opacity: 0; }
      55%      { opacity: 0.9; }
    }
    /* 후레쉬가 지나가면 장면 전체가 사라진다 */
    .kf-chart-wrap.is-cleared { opacity: 0; transition: opacity .55s ease; }

    /* 50% 대사에만 뜨는 하단 각주 */
    .kf-foot {
      text-align: center; font-size: 0.74rem; color: var(--dim);
      line-height: 1.6; padding: 0 var(--sp-4) var(--sp-2);
      transition: opacity .3s ease;
    }
    .kf-foot.is-off { opacity: 0; }

    .kf-scroll-hint {
      display: flex; align-items: center; justify-content: center; gap: var(--sp-2);
      font-size: 0.82rem; font-weight: 700; color: var(--frog);
      padding-bottom: var(--sp-2); transition: opacity .3s ease;
    }
    .kf-scroll-hint.is-off { opacity: 0; }
    .kf-scroll-hint .arr { display: inline-block; animation: kf-nudge 1.6s ease-in-out infinite; }
    @keyframes kf-nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }

    /* ── 기존 CTA ── */
    .idx-cta-wrap { text-align: center; padding: var(--sp-12) var(--sp-4) var(--sp-12); }
    .idx-cta {
      display: inline-flex; align-items: center; gap: var(--sp-1);
      color: var(--frog); font-size: 0.92rem; font-weight: 700;
      text-decoration: none; padding: var(--sp-2) var(--sp-4);
      border-radius: var(--r-pill); background: transparent;
    }
    .idx-cta .arrow { transition: transform 0.15s ease; }
    .idx-cta:hover { background: var(--frog-bg); text-decoration: underline; }
    .idx-cta:hover .arrow { transform: translateX(3px); }

    .kf-note { text-align: center; }

    /* ── 세 번째 장면: 테더 김프 ── */
    /* 테더는 1달러에 고정 — y축 왼쪽에 붙는 기준선 표시 */
    .kf-dollar {
      fill: var(--mut); font-family: 'Pretendard', sans-serif;
      font-size: 30px; font-weight: 800;
    }
    /* 이 장면의 화살표는 김프가 아니라 눈금을 재는 자라서 검은색 */
    #t3Arrows .kf-arrow { stroke: var(--text); }
    #t3Arrows .kf-arrow-head { fill: var(--text); }
    #t3Arrows .kf-arrow-label { fill: var(--text); }

    /* Sell! / Buy! — 김프로그가 사고판 자리에 남는다 */
    .kf-trade {
      font-family: 'Pretendard', sans-serif; font-size: 34px; font-weight: 800;
      text-anchor: middle;
    }
    .kf-trade.sell { fill: var(--accent); }
    /* 파랑은 shared.css 토큰엔 없는 색 — 산 자리를 판 자리와 갈라 보이려고 쓴다 */
    .kf-trade.buy { fill: #2c6da3; }
    /* 사고판 자리를 형광펜으로 동그랗게 짚어 준다 */
    .kf-mark { fill-opacity: 0.42; }
    .kf-mark.sell { fill: #d9584a; }
    .kf-mark.buy { fill: #5b9bd5; }

    /* ── 네 번째 장면: 코인과 테더를 나란히 ── */
    /* 형광펜 노랑도 shared.css 토큰엔 없는 색 */
    .kf-floor {
      fill: none; stroke: #ffd93d; stroke-width: 17;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .kf-floor.is-blink { animation: kf-floor-blink 1.15s ease-in-out infinite; }
    @keyframes kf-floor-blink { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.3; } }
    .kf-mini-line { fill: none; stroke: var(--text); stroke-width: 3; stroke-linecap: round; }
    .kf-mini-kimp { fill: none; stroke: var(--accent); stroke-width: 3.5; stroke-linejoin: round; }
    .kf-mini-fill { fill: var(--accent); fill-opacity: 0.16; }
    .kf-mini-axis { stroke: var(--text); stroke-width: 2.5; stroke-linecap: round; fill: none; }
    /* ── 다섯 번째 장면: 원화로 본 테더 ── */
    .kf-tick { stroke: var(--text); stroke-width: 2.5; stroke-linecap: round; }
    .kf-tick-label { fill: var(--mut); font-family: 'Pretendard', sans-serif; font-size: 24px; font-weight: 700; }
    .kf-won { fill: var(--text); font-family: 'Pretendard', sans-serif; font-size: 34px; font-weight: 800; }
    .kf-line-label { font-family: 'Pretendard', sans-serif; font-size: 26px; font-weight: 800; }
    .kf-line-label.rate { fill: var(--text); }
    .kf-line-label.kimp { fill: var(--accent); }
    /* '김프' '환율' — 도장 찍듯이 쾅 */
    .kf-stamp {
      font-family: 'Pretendard', sans-serif; font-size: 62px; font-weight: 800;
      opacity: 0; transform-box: fill-box; transform-origin: center;
    }
    .kf-stamp.kimp { fill: var(--accent); }
    .kf-stamp.rate { fill: var(--text); }
    .kf-stamp.is-on { animation: kf-stamp .34s cubic-bezier(.2, .8, .3, 1.5) both; }
    @keyframes kf-stamp {
      0%   { opacity: 0; transform: scale(2.6) rotate(-12deg); }
      60%  { opacity: 1; transform: scale(0.94) rotate(-5deg); }
      100% { opacity: 1; transform: scale(1) rotate(-5deg); }
    }
    /* 마지막 대사가 뜨면 아래 버튼을 눈에 띄게 */
    .idx-cta.is-call {
      background: var(--frog-bg);
      animation: kf-cta-call 1.5s ease-in-out infinite;
    }
    @keyframes kf-cta-call {
      0%, 100% { transform: translateY(0); box-shadow: 0 0 0 0 var(--frog-line); }
      50%      { transform: translateY(-3px); box-shadow: 0 0 0 9px transparent; }
    }

    /* 얼굴 오른쪽에 붙을 때는 꼬리가 왼쪽을 향한다 */
    .kf-say.is-side:after {
      left: -8px; bottom: auto; top: var(--tail-y, 50%); margin-left: 0; margin-top: -7px;
      transform: rotate(45deg);
    }

    @media (max-width: 560px) {
      .kf-scrolly { height: 1010vh; }
      .kf-scrolly2 { height: 470vh; }
      .kf-scrolly3 { height: 740vh; }
      .kf-scrolly4 { height: 430vh; }
      .kf-scrolly5 { height: 520vh; }
      .kf-dollar { font-size: 34px; }
      .kf-trade { font-size: 38px; }
      .kf-say { font-size: 0.86rem; padding: var(--sp-2) var(--sp-4); max-width: 84%; }
      .kf-say .big { font-size: 1.02rem; }
      .kf-axis-label { font-size: 26px; }
      /* 좁은 화면에서는 카드를 여백 절반까지만 넓힌다 (완전히 밖으로 빼면 모서리가 잘린다) */
      .kf-chart-wrap { margin-left: -12px; margin-right: -12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .kf-scroll-hint .arr { animation: none; }
      .kf-bag-ring { animation: none; opacity: .5; }
      .kf-spark { animation: none !important; opacity: 1; }
      .rat-sprite.is-grow { animation: none; }
      .kf-gain.is-on { animation: none; opacity: 1; }
      .kf-say { transition: none; }
      .kf-floor.is-blink { animation: none; }
      .kf-stamp.is-on { animation: none; opacity: 1; }
      .idx-cta.is-call { animation: none; }
    }
  </style>
</head>
<body>
  <div id="topnav-root"></div>
  <script src="../../shared/nav.js"></script>
  <script src="../../shared/sound.js"></script>
  <script src="../../chatbot/chatbot-widget.js"></script>

  <script>
    // ══════════════════════════════════════════════════════════
    // 시작화면 — 누르면 사라지고 스크롤 스토리가 시작된다
    //   · 떠 있는 동안 스크롤을 막는다. 안 그러면 시작화면 뒤에서 이야기가
    //     이미 진행돼 버리고, 새로고침 때 브라우저가 옛 위치를 되살리기도 한다.
    //   · '소리 켜고 시작' 을 누르는 그 순간이 브라우저가 요구하는 사용자 조작이라,
    //     자동재생 차단을 우회 없이 정면으로 통과한다.
    // ══════════════════════════════════════════════════════════
    // 시작화면 마크업은 아래 그래프 카드 안에 있어서, 이 스크립트보다 뒤에 온다.
    // 그래서 DOM 이 다 만들어진 뒤에 붙인다.
    function initStartScreen() {
      var scr = document.getElementById('startScreen');
      if (!scr) {
        // 잠금은 이 함수 밖에서 미리 걸어 뒀다. 시작화면이 없으면 풀어 줄 사람이
        // 아무도 없으므로 여기서 풀어야 한다 — 안 그러면 스크롤이 영영 잠긴다.
        document.documentElement.style.overflow = '';
        return;
      }
      var go = document.getElementById('startGo');
      var card = document.getElementById('chartWrap');
      // 소리 토글(평소엔 화면 좌하단 고정)을 시작화면 동안만 배너 오른쪽 위로 데려온다
      var fab = document.querySelector('.sound-fab');
      var gone = false;

      if (card) card.classList.add('is-start');
      if (fab) { fab.classList.add('in-start'); scr.appendChild(fab); }
      // 배경음악을 걸어 둔다. 소리가 꺼져 있으면 sound.js 가 기억만 했다가
      // 토글을 켜는 순간 틀어 준다 (브라우저가 조작 전 재생을 막기 때문).
      if (window.Sound && window.Sound.music) window.Sound.music('main');

      function start() {
        if (gone) return;
        gone = true;
        // 소리가 켜져 있으면 시작하는 순간 코인 소리로 받아 준다
        if (window.Sound) window.Sound.play('coin');
        if (fab) { fab.classList.remove('in-start'); document.body.appendChild(fab); }
        if (card) card.classList.remove('is-start');   // 카드를 원래 높이로
        document.documentElement.style.overflow = '';
        window.scrollTo(0, 0);
        scr.classList.add('is-out');
        setTimeout(function () { if (scr.parentNode) scr.parentNode.removeChild(scr); }, 500);
      }

      scr.addEventListener('click', function (e) {
        if (fab && fab.contains(e.target)) return;   // 소리 토글을 누른 건 '시작' 이 아니다
        start();
      });
      if (go) go.addEventListener('click', function (e) { e.stopPropagation(); start(); });

      // 버튼에 마우스를 올릴 때 스치는 소리.
      //   · 1.5배속으로 줄인다 — 원래 661ms 라 호버치고는 길다.
      //   · 700ms 안에는 다시 울리지 않는다. 버튼 위에서 마우스를 흔들면
      //     기본 간격(200ms)으로는 드르륵거린다.
      var lastHover = 0;
      if (go) go.addEventListener('mouseenter', function () {
        var now = Date.now();
        if (now - lastHover < 700) return;
        lastHover = now;
        if (window.Sound) window.Sound.play('stamp', 1.5);
      });

      // 소리를 켜면 권유 줄은 할 일을 다 한 것이다
      var tip = document.getElementById('startTip');
      function paintTip() {
        if (!tip) return;
        tip.classList.toggle('is-off', !!(window.Sound && window.Sound.isOn()));
      }
      paintTip();
      if (fab) fab.addEventListener('click', function () { setTimeout(paintTip, 0); });
      // 아무 데서나 Enter/Space 로 시작할 수 있게 하되, 누를 것이 이미 있는
      // 자리(네비 링크·버튼·입력칸)에서는 손대지 않는다. 안 그러면 Tab 으로
      // 네비 링크에 간 사람이 Enter 를 눌러도 링크 대신 이야기가 시작된다.
      window.addEventListener('keydown', function (e) {
        if (gone) return;
        if (e.key !== 'Enter' && e.key !== ' ') return;
        var t = e.target, tag = (t && t.tagName || '').toLowerCase();
        if (tag === 'a' || tag === 'button' || tag === 'input' ||
            tag === 'select' || tag === 'textarea' || (t && t.isContentEditable)) return;
        e.preventDefault(); start();
      });
    }

    // 스크롤 잠금만은 지금 당장 건다. DOM 을 기다리는 사이에 스크롤되면
    // 시작화면 뒤에서 이야기가 이미 진행돼 버린다.
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    document.documentElement.style.overflow = 'hidden';
    window.scrollTo(0, 0);

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initStartScreen);
    } else {
      initStartScreen();
    }
  </script>

  <div class="wrap">
    <div class="kf-scrolly" id="scrolly">
      <div class="kf-stage" id="stage">

        <div class="kf-chart-wrap" id="chartWrap">

          <!-- 시작화면. 누르면 사라지고 스크롤 스토리가 시작된다 -->
          <div class="kf-start" id="startScreen" role="dialog" aria-modal="true" aria-label="김프로그 시작하기">
            <div class="kf-start-art">
              <img src="../../assets/%EA%B9%80%ED%94%84%EB%A1%9C%EA%B7%B8%20%EC%8B%9C%EC%9E%91%20%EB%B0%B0%EA%B2%BD-%EC%8B%9C%EC%9E%91%ED%99%94%EB%A9%B4.jpg" alt="김프로그 — 김치 프리미엄을 배달하는 개구리">
              <button class="kf-start-go" id="startGo" type="button">시작하기</button>
            </div>
            <div class="kf-start-tip" id="startTip">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path class="spk" d="M4 9.4h3.4L12 5.2v13.6L7.4 14.6H4z"/>
                <path d="M15.3 9.4a3.7 3.7 0 0 1 0 5.2"/>
                <path d="M17.9 6.9a7.3 7.3 0 0 1 0 10.2"/>
              </svg>
              소리를 켜면 더 재밌어요
            </div>
          </div>

          <svg class="kf-chart" id="chart" viewBox="0 0 1080 660" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <g id="world">
            <g class="kf-fade" id="axisGroup" opacity="0">
              <path class="kf-axis" d="M70 40 L70 580 L960 580"></path>
            </g>

            <!-- 두 선 사이 = 김프 -->
            <path class="kf-gap-fill kf-fade" id="gapFill" opacity="0"></path>

            <!-- 검은 선: 해외 시세 = 김프로그가 밟는 땅 -->
            <path class="kf-line-price kf-fade" id="priceLine" opacity="0"></path>
            <!-- 빨간 선: 국내 시세 (해외 시세 + 김프). 끝점이 김치 꼭대기에 정확히 붙는다.
                 김프로그를 위에 그려서, 몸을 가로지르는 구간은 가려지고 김치 윗면에 닿는 것만 보인다 -->
            <path class="kf-line-kimp" id="kimpLine"></path>

            <!-- 김프 화살표 — 김치에 가리지 않도록 김프로그보다 위에 그린다 -->
            <g class="kf-fade" id="arrowG" opacity="0">
              <line class="kf-arrow" id="arrowLine"></line>
              <polygon class="kf-arrow-head" id="arrowTop"></polygon>
              <polygon class="kf-arrow-head" id="arrowBottom"></polygon>
              <text class="kf-arrow-label" id="arrowLabel">김프</text>
            </g>

            <!-- 범례 -->
            <g class="kf-fade" id="legendG" opacity="0">
              <line class="kf-legend-mark dom" x1="700" y1="452" x2="742" y2="452"></line>
              <text class="kf-legend-text" x="756" y="462">국내 시세</text>
              <line class="kf-legend-mark abr" x1="700" y1="506" x2="742" y2="506"></line>
              <text class="kf-legend-text" x="756" y="516">해외 시세</text>
            </g>

            <!-- 김프로그: 발밑이 원점 -->

          var p0 = pts[i], p1 = pts[i + 1];

        }

        var n = KIMP_SERIES.length - 1;

      function kimchiTopFor(s, frog) {

      }

      // 임의의 x에서 해외 시세선의 높이 (화살표·채우기용)
      function priceYAt(x) {
        if (x <= pricePts[0][0]) return pricePts[0][1];
        var last = pricePts[SAMPLES];
        if (x >= last[0]) return last[1];
        for (var i = 1; i <= SAMPLES; i++) {
          if (pricePts[i][0] >= x) {
            var a = pricePts[i-1], b = pricePts[i];
            var f = (x - a[0]) / (b[0] - a[0] || 1);
            return lerp(a[1], b[1], f);

        var top = kimchiTopFor(s, FROGS.stand);

        var out = [];
        for (var i = 0; i <= SAMPLES; i++) {

          w = w * w * (3 - 2 * w);                 // 부드럽게 들어올리기
          out.push([kimpPts[i][0] + ddx * w, kimpPts[i][1] + ddy * w]);
        }
        return out;
      }

        var xMax = pricePts[SAMPLES][0];

        return d + ' Z';

      // 달러·코인은 소~대까지, 원화는 중~특대까지 있다 (파는 순간 한 단계 커지므로).
      var SIZE_TAG = ['S', 'M', 'L', 'XL'];
      var bagSize = 0;
      function spriteOf(kind, pose) {
        var i = bagSize;
        if (kind === 'won') i = clamp(i, 1, 3); else i = clamp(i, 0, 2);
        return kind + pose + SIZE_TAG[i];
      }
      Object.keys(SPRITES).forEach(function (k) {
        var sp = SPRITES[k];
        sp.el = document.getElementById(sp.id);
        sp.h = RAT_BODY / sp.body;
        sp.w = sp.h * sp.ar;
      });

      // 서는 자리 — (가슴 x, 발밑 y)
      var SPOTS = {
        bank:     { x: 402, y: 643 },
        abroad:   { x: 61,  y: 302 },
        domestic: { x: 757, y: 302 }
      };

      var bagG = document.getElementById('bagG');
      var ratState = 'dollarStand', ratAt = { x: SPOTS.bank.x, y: SPOTS.bank.y };

      // 보따리 위에 얹는 표시. 안쪽부터 번지는 빛 → 퍼지는 링 → 별 넷 → 클릭 영역.
      // 그룹째로 보따리 크기에 맞춰 확대하므로(placeRat), 여기 좌표는 '보통 크기' 기준이다.
      (function buildBagMark() {
        function star(dx, dy, r, cls) {
          var d = 'M0 ' + (-r) + ' Q' + (r * 0.22) + ' ' + (-r * 0.22) + ' ' + r + ' 0' +
                  ' Q' + (r * 0.22) + ' ' + (r * 0.22) + ' 0 ' + r +
                  ' Q' + (-r * 0.22) + ' ' + (r * 0.22) + ' ' + (-r) + ' 0' +
                  ' Q' + (-r * 0.22) + ' ' + (-r * 0.22) + ' 0 ' + (-r) + ' Z';
          // 위치는 <g>가 잡고 반짝임(scale)은 안쪽 path에만 — 같은 요소에 두면 서로 덮어쓴다
          var wrap = el('g', { transform: 'translate(' + dx + ' ' + dy + ')' });
          wrap.appendChild(el('path', { class: 'kf-spark ' + cls, d: d }));
          return wrap;
        }
        bagG.appendChild(el('circle', { class: 'kf-bag-ring', cx: 0, cy: 0, r: 24 }));
        bagG.appendChild(el('circle', { class: 'kf-bag-ring kf-bag-ring-b', cx: 0, cy: 0, r: 24 }));
        // 별은 보따리 테두리를 빙 두른다. 더 벌리면 김프랫 얼굴 위로 올라간다.
        bagG.appendChild(star(-26, -16, 9, 'kf-spark-a'));
        bagG.appendChild(star(25, -10, 8, 'kf-spark-b'));
        bagG.appendChild(star(-11, 26, 7, 'kf-spark-c'));
        bagG.appendChild(star(21, 21, 6.5, 'kf-spark-d'));
        // 이야기를 출발시키는 자리. 보이는 링(r=24)보다 넉넉히 잡아
        // 손가락으로도 편히 눌리게 한다 — 좁은 화면에서 40px 안팎이 된다.
        var hot = el('circle', { class: 'kf-hot', cx: 0, cy: 0, r: 46 });
        hot.addEventListener('click', function (e) { e.stopPropagation(); pressBag(); });
        bagG.appendChild(hot);
      }());

      // 가슴 x·발밑 y 기준으로 그림을 놓고, 반짝임은 보따리 한가운데에 얹는다
      function placeRat(state, x, y) {
        ratState = state; ratAt.x = x; ratAt.y = y;
        Object.keys(SPRITES).forEach(function (k) {
          SPRITES[k].el.style.display = (k === state) ? '' : 'none';
        });
        var sp = SPRITES[state];
        var ix = x - sp.chili[0] * sp.w, iy = y - sp.h;
        sp.el.setAttribute('x', ix.toFixed(1));
        sp.el.setAttribute('y', iy.toFixed(1));
        sp.el.setAttribute('width', sp.w.toFixed(1));
        sp.el.setAttribute('height', sp.h.toFixed(1));
        // 보따리가 커지면 표시도 조금 커진다. 그림 폭에 그대로 비례시키면
        // (스프라이트마다 가로 여백이 달라) 표시가 보따리를 훌쩍 넘어서므로 눌러 준다.
        bagG.setAttribute('transform',
          'translate(' + (ix + sp.bag[0] * sp.w).toFixed(1) + ' ' +
          (iy + sp.bag[1] * sp.h).toFixed(1) + ') scale(' + (0.8 + sp.w / 600).toFixed(3) + ')');
      }
      placeRat(spriteOf('dollar', 'Stand'), SPOTS.bank.x, SPOTS.bank.y);

      // ── 보따리가 커질 때 터지는 효과 ──
      var popG = document.getElementById('popG');
      (function buildPop() {
        popG.setAttribute('class', 'kf-pop');
        popG.appendChild(el('circle', { class: 'kf-pop-ring', cx: 0, cy: 0, r: 30 }));
        for (var i = 0; i < 10; i++) {
          var g = el('g', { transform: 'rotate(' + (i * 36) + ')' });
          var bit = el('circle', { class: 'kf-pop-bit', cx: 0, cy: -26, r: 7 });
          bit.style.animationDelay = (i % 3) * 0.05 + 's';
          g.appendChild(bit);
          popG.appendChild(g);
        }
      }());

      // 지금 스프라이트의 보따리 위치에서 팡 터뜨린다
      function popBag() {
        var sp = SPRITES[ratState];
        var x = ratAt.x - sp.chili[0] * sp.w + sp.bag[0] * sp.w;
        var y = ratAt.y - sp.h + sp.bag[1] * sp.h;
        var k = (sp.w / 170).toFixed(2);   // 보따리가 클수록 효과도 크게
        popG.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ') scale(' + k + ')');
        popG.classList.remove('is-on');
        void popG.getBoundingClientRect();
        popG.classList.add('is-on');
        setTimeout(function () { popG.classList.remove('is-on'); }, 700);
      }

      // 판 순간 '+김프' 가 보따리 위로 떠오른다
      var gainText = document.getElementById('gainText');
      function showGain() {
        var sp = SPRITES[ratState];
        var x = ratAt.x - sp.chili[0] * sp.w + sp.bag[0] * sp.w;
        // 보따리 위쪽. 그림마다 크기가 달라 고정값 대신 비율로 띄운다.
        var y = ratAt.y - sp.h + (sp.bag[1] - 0.42) * sp.h;
        gainText.setAttribute('x', x.toFixed(1));
        gainText.setAttribute('y', y.toFixed(1));
        gainText.textContent = '+김프';
        gainText.classList.remove('is-on');
        void gainText.getBoundingClientRect();
        gainText.classList.add('is-on');
        setTimeout(function () { gainText.classList.remove('is-on'); }, 1000);
      }

      // 보따리가 커진 그림을 한 번 튀어오르게 한다
      var growTimer = null;
      function popGrow() {
        var e = SPRITES[ratState].el;
        clearTimeout(growTimer);
        Object.keys(SPRITES).forEach(function (k) { SPRITES[k].el.classList.remove('is-grow'); });
        void e.getBoundingClientRect();
        e.classList.add('is-grow');
        growTimer = setTimeout(function () { e.classList.remove('is-grow'); }, 420);
      }

      // 보따리 종류(또는 크기)를 바꾸면서 팡 효과까지
      function swapBag(kind, pose) {
        placeRat(spriteOf(kind, pose), ratAt.x, ratAt.y);
        popBag();
      }

      // ── 대사 ──
      var ratSay = document.getElementById('ratSay');
      var ratSayText = document.getElementById('ratSayText');

      function showRatSay(html) {
        ratSayText.innerHTML = html;
        ratSay.classList.remove('is-hidden');
        var sp = SPRITES[ratState];
        var head = toWrapPx(ratAt.x, ratAt.y - sp.h);
        var wrapW = chartWrap.clientWidth, wrapH = chartWrap.clientHeight;
        var bw = ratSay.offsetWidth, bh = ratSay.offsetHeight;
        var left = clamp(head.x - bw / 2, 6, Math.max(6, wrapW - bw - 6));
        var top = clamp(head.y - bh - 18, 4, Math.max(4, wrapH - bh - 4));
        ratSay.style.left = left.toFixed(0) + 'px';
        ratSay.style.top = top.toFixed(0) + 'px';
        ratSay.style.setProperty('--tail-x', clamp(head.x - left, 18, Math.max(18, bw - 18)).toFixed(0) + 'px');
      }
      function hideRatSay() { ratSay.classList.add('is-hidden'); }
      // 반짝임은 '지금 눌러야 한다'는 표시다. 누를 차례가 아니면 꺼 둔다.
      function setSparkle(on) { bagG.style.display = on ? '' : 'none'; }

      // ── 포돌이 ──────────────────────────────────────────────
      var PODORI = { ar: 0.754, h: 150 };     // 227x301
      var podori = document.getElementById('podori');
      var podoriSay = document.getElementById('podoriSay');
      var podoriSayText = document.getElementById('podoriSayText');
      var podoriAt = null;

      function showPodori() {
        var sp = SPRITES[ratState];
        var ratLeft = ratAt.x - sp.chili[0] * sp.w;
        var w = PODORI.h * PODORI.ar;
        var x = ratLeft - w - 14, y = ratAt.y - PODORI.h;   // 김프랫 왼쪽, 같은 바닥선
        podori.setAttribute('x', x.toFixed(1));
        podori.setAttribute('y', y.toFixed(1));
        podori.setAttribute('width', w.toFixed(1));
        podori.setAttribute('height', PODORI.h.toFixed(1));
        podori.setAttribute('opacity', 1);
        podoriAt = { x: x + w / 2, y: y };
      }

      // 말풍선을 지정한 지점 위에 띄운다 (김프랫/포돌이 공용)
      function bubbleAt(box, textEl, html, headX, headY) {
        textEl.innerHTML = html;
        box.classList.remove('is-hidden');
        var head = toWrapPx(headX, headY);
        var wrapW = chartWrap.clientWidth, wrapH = chartWrap.clientHeight;
        var bw = box.offsetWidth, bh = box.offsetHeight;
        var left = clamp(head.x - bw / 2, 6, Math.max(6, wrapW - bw - 6));
        var top = clamp(head.y - bh - 18, 4, Math.max(4, wrapH - bh - 4));
        box.style.left = left.toFixed(0) + 'px';
        box.style.top = top.toFixed(0) + 'px';
        box.style.setProperty('--tail-x', clamp(head.x - left, 18, Math.max(18, bw - 18)).toFixed(0) + 'px');
      }

      // ── 마지막 후레쉬 ──
      var flash = document.getElementById('flash');
      var flashImg = document.getElementById('flashImg');
      flashImg.addEventListener('error', function () { flash.classList.add('no-img'); });
      var storyDone = false;

      function finale() {
        flash.classList.add('is-on');
        sfx('siren');
        if (window.Sound && window.Sound.music) window.Sound.music(null);   // 사이렌만 들리게
        setTimeout(function () {            // 후레쉬가 퍼질 때 장면을 지운다
          chartWrap.classList.add('is-cleared');
          hideRatSay(); podoriSay.classList.add('is-hidden');
        }, 700);
        setTimeout(function () {            // 다 끝나면 스크롤을 풀어준다
          flash.classList.remove('is-on');
          storyDone = true;
          if (window.Sound && window.Sound.music) window.Sound.music('main', true);   // 처음부터 다시
        }, 1500);
      }

      // ═════════════════════════════════════════════════════════
      //  시나리오 — 자동 재생 (박자 큐)
      //    · 장면에 들어오면 알아서 흐른다. 넘기려고 클릭할 필요가 없다.
      //    · 화면 아무 데나 누르면(Space/Enter/→ 도 같다) 지금 박자를 즉시 끝낸다.
      //    · '건너뛰기'는 포돌이 경고 바로 앞으로 보낸다.
      //      경고와 '절대 따라하지 마세요'는 어떤 경로로도 건너뛸 수 없다.
      //
      //  박자 하나 = function(next). 자기 일이 끝나면 next()를 부른다.
      //  박자마다 beatSkip 에 '지금 박자를 끝내는 법'을 걸어 두면 빨리감기가 된다.
      //  beatGen 은 세대 번호다 — 다음 박자로 넘어갈 때 하나 올려서,
      //  앞 박자가 걸어 둔 setTimeout/rAF 가 뒤늦게 깨어나도 무시되게 한다.
      // ═════════════════════════════════════════════════════════
      var SPEED = 1;             // 전체 속도 배수. 0.8로 두면 20% 빨라진다
      var MOVE_MS = 900;         // 한 구간 이동
      var LAP_MS = [700, 460];   // 반복 구간 — 바퀴마다 빨라진다
      var LAPS = 2;
      var PRESS_HOLD = 600;      // 보따리를 누른 뒤, 바뀐 보따리를 보여주고 나서 움직인다
      var SELL_HOLD = 700;       // 판 직후 그 자리에 머무는 시간
      var SELL_HOLD_LAST = 950;  // 마지막 판매 — 가장 큰 보따리를 보여주는 자리
      // 빨리 감아도 이만큼은 화면에 남는다. 연타로 이야기가 통째로 날아가는 걸 막고,
      // 실수로 두 번 눌렀을 때 한 박자가 통째로 사라지는 것도 막아 준다.
      var MIN_DWELL = 450;

      var beats = [], beatIdx = -1, beatSkip = null, beatGen = 0, WARN_AT = 0;
      var beatAt = 0, beatMin = 0;   // 이 박자가 시작한 시각 / 최소로 머물 시간
      // ratWaiting = 보따리를 눌러 주기를 기다리는 중이면, 누를 때 부를 함수가 들어 있다
      var ratPlaying = false, ratStarted = false, hintTimer = null, ratWaiting = null;
      var skipBtn = document.getElementById('ratSkip');
      var tapHint = document.getElementById('ratTapHint');
      var pressBtn = document.getElementById('bagPress');   // 보따리의 키보드·스크린리더 짝

      // 키보드를 쓴 적이 있는지. 마우스만 쓰는 사람에게까지 초점을 옮기면
      // (:focus-visible 이 걸려) 숨겨 둔 버튼이 드러나므로 구분한다.
      var usedKeyboard = false;
      window.addEventListener('keydown', function (e) {
        if (e.key === 'Tab' || e.key === 'Enter' || e.key === ' ' ||
            e.key.indexOf('Arrow') === 0) usedKeyboard = true;
      }, true);

      function kindOf(state) { return state.replace(/(Stand|Run)(S|M|L|XL)$/, ''); }

      function nextBeat() {
        beatSkip = null;
        beatGen++;
        beatIdx++;
        beatAt = Date.now(); beatMin = MIN_DWELL;   // 박자가 직접 더 길게 잡을 수도 있다
        if (beatIdx >= beats.length) { ratPlaying = false; return; }
        beats[beatIdx](nextBeat);
      }

      // 지금 박자를 즉시 끝내고 다음으로. 최소 체류 시간 전에는 듣지 않는다.
      function fastForward() {
        if (!ratPlaying || !beatSkip) return;
        if (Date.now() - beatAt < beatMin) return;
        var f = beatSkip; beatSkip = null; f();
      }

      // 말풍선 하나 — hold(ms) 만큼 머문다. swap 을 주면 말과 동시에 보따리가 바뀐다.
      //   minMs 를 주면 그만큼은 빨리 감아도 넘어가지 않는다(꼭 읽혀야 하는 말).
      function sayBeat(html, hold, swap, minMs) {
        return function (next) {
          var g = beatGen;
          if (minMs) beatMin = minMs;
          if (swap) swapBag(swap[0], swap[1]);
          showRatSay(html);
          sfx('say-rat');
          var t = setTimeout(function () { if (g === beatGen) next(); }, hold * SPEED);
          beatSkip = function () { clearTimeout(t); next(); };
        };
      }

      // 한 구간 이동 — 뛰는 그림으로 달려가 arriveKind 보따리로 도착한다.
      //   sell=true 면 도착과 동시에 보따리가 한 단계 커진다.
      //   keep=true 면 도착해도 보따리를 그대로 둔다 (첫 바퀴 — 눌러야 바뀐다)
      function moveBeat(arriveKind, spot, ms, sell, keep) {
        return function (next) {
          var g = beatGen, from = { x: ratAt.x, y: ratAt.y };
          var fromKind = kindOf(ratState), runKey = spriteOf(fromKind, 'Run');
          var raf = 0, t0 = null;
          hideRatSay();
          // 달리는 내내 발소리를 깐다. 구간이 짧을수록(=바퀴가 빨라질수록) 배속을 올리고
          // 보폭 간격도 같이 좁혀서, '점점 빨라진다'가 눈만이 아니라 귀로도 들리게 한다.
          var rate = MOVE_MS / ms;
          var stepGap = 135 / rate, lastStep = -1e9;
          function land() {
            if (g !== beatGen) return;
            if (keep) {                                      // 보따리는 그대로 — 누를 때 바뀐다
              placeRat(spriteOf(fromKind, 'Stand'), spot.x, spot.y);
              next(); return;
            }
            var grew = sell && bagSize < 3;
            if (sell) bagSize = Math.min(bagSize + 1, 3);
            placeRat(spriteOf(arriveKind, 'Stand'), spot.x, spot.y);
            if (sell || arriveKind !== fromKind) popBag();   // 달라진 게 있을 때만 팡
            if (grew) { popGrow(); showGain(); sfx('pay'); }  // 커진 순간을 눈·귀에 걸어 준다
            next();
          }
          function step(ts) {
            if (g !== beatGen) return;
            if (t0 === null) t0 = ts;
            var t = clamp((ts - t0) / (ms * SPEED), 0, 1);
            var e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
            if (ts - lastStep >= stepGap) { lastStep = ts; sfx('dash', rate); }
            placeRat(runKey, lerp(from.x, spot.x, e), lerp(from.y, spot.y, e));
            if (t < 1) raf = requestAnimationFrame(step); else land();
          }
          raf = requestAnimationFrame(step);
          beatSkip = function () { cancelAnimationFrame(raf); land(); };
        };
      }

      // 그 자리에 잠깐 머문다. 커진 보따리를 눈이 따라잡을 시간을 준다.
      // 이게 없으면 판 직후 곧바로 다음 달리기가 시작돼, 커진 그림이 한 프레임만 뜬다.
      function holdBeat(ms) {
        return function (next) {
          var g = beatGen;
          var t = setTimeout(function () { if (g === beatGen) next(); }, ms * SPEED);
          beatSkip = function () { clearTimeout(t); next(); };
        };
      }

      // 보따리를 눌러야 넘어가는 박자. 이야기가 사용자를 기다리는 지점이다.
      // 빨리감기로는 못 지나간다 — 눌러야 한다.
      //   swap 을 주면 '누르는 순간' 보따리가 그 종류로 바뀐다. 도착만으로는 안 바뀐다.
      //   grow=true 면 누르는 순간 한 단계 커진다(판 자리).
      function pressBeat(swap, grow) {
        return function (next) {
          ratWaiting = function () {
            if (swap || grow) {
              if (grow) bagSize = Math.min(bagSize + 1, 3);
              swapBag(swap || kindOf(ratState), 'Stand');   // 종류·크기를 한 번에 반영 + 팡
              popGrow();                                    // 바뀌는 순간 통통 튄다
              if (grow) { showGain(); sfx('pay'); }         // 결제음은 '커질 때'만
              else sfx('dash');                             // 그냥 바뀌기만 하면 가벼운 톡
            } else {
              popBag(); sfx('dash');                        // 안 바뀌는 첫 클릭에도 반응은 준다
            }
            // 처음 보따리를 누르는 순간부터 김프랫 구간의 곡으로 갈아탄다
            if (window.Sound && window.Sound.music) window.Sound.music('rat');
            // 바뀐 보따리를 눈으로 확인할 틈을 주고 나서 움직인다.
            // 이 사이엔 빨리감기를 막는다 — 보여주려고 둔 시간이라서.
            var g = beatGen;
            beatAt = Date.now(); beatMin = PRESS_HOLD;
            var t = setTimeout(function () { if (g === beatGen) next(); }, PRESS_HOLD * SPEED);
            beatSkip = function () { clearTimeout(t); next(); };
          };
          setSparkle(true);
          bagG.classList.add('is-press');
          pressBtn.classList.remove('is-hidden');
          // 여기서 이야기가 사용자를 기다린다. 키보드를 쓰던 사람이면 초점을 옮겨 준다.
          // 첫 Tab 은 화면 맨 위 네비로 올라가 버려(스크롤이 따라 올라가 장면이 리셋된다)
          // 스스로 찾아오게 두면 안 된다. preventScroll 로 화면은 그대로 둔다.
          if (usedKeyboard) {
            try { pressBtn.focus({ preventScroll: true }); } catch (e) { pressBtn.focus(); }
          }
          tapHint.textContent = '반짝이는 보따리를 눌러봐';
          tapHint.classList.add('is-call');
          tapHint.classList.remove('is-hidden');
          clearTimeout(hintTimer);
        };
      }

      // 은행 → 해외 → 국내 → 은행 한 바퀴를 n번. 바퀴마다 빨라진다.
      //   바퀴는 빨라지지만, '판 직후'만은 멈춰 세운다.
      //   가속 연출과 '보따리가 커졌다'를 함께 살리려면 이 멈춤이 필요하다.
      //   마지막 바퀴의 멈춤이 제일 길다 — 가장 큰 보따리를 보여주는 자리라서.
      function lapBeats(n) {
        var out = [];
        for (var i = 0; i < n; i++) {
          var ms = LAP_MS[Math.min(i, LAP_MS.length - 1)];
          out.push(moveBeat('coin', SPOTS.abroad, ms, false));
          out.push(moveBeat('won', SPOTS.domestic, ms, true));
          out.push(holdBeat(i === n - 1 ? SELL_HOLD_LAST : SELL_HOLD));
          out.push(moveBeat('dollar', SPOTS.bank, ms, false));
        }
        return out;
      }

      // 포돌이가 나와 한마디 — 말풍선 주인이 김프랫이 아니라 포돌이다
      function podoriBeat(html, hold, minMs) {
        return function (next) {
          var g = beatGen;
          if (minMs) beatMin = minMs;
          hideRatSay(); showPodori();
          bubbleAt(podoriSay, podoriSayText, html, podoriAt.x, podoriAt.y);
          sfx('dread');
          function close() { podoriSay.classList.add('is-hidden'); next(); }
          var t = setTimeout(function () { if (g === beatGen) close(); }, hold * SPEED);
          beatSkip = function () { clearTimeout(t); close(); };
        };
      }

      // 눌러야 넘어가는 대사 — 시간으로 저절로 넘어가지 않는다.
      // 마지막 경고는 그냥 흘려보내지 말고 한 번씩 읽고 넘기게 한다.
      function tapBeat(html, minMs, who) {
        return function (next) {
          beatMin = minMs || MIN_DWELL;
          if (who === 'podori') {
            hideRatSay(); showPodori();
            bubbleAt(podoriSay, podoriSayText, html, podoriAt.x, podoriAt.y);
            sfx('dread');
          } else {
            podoriSay.classList.add('is-hidden');
            showRatSay(html);
            sfx('say-rat');
          }
          tapHint.textContent = '눌러서 계속';
          tapHint.classList.remove('is-call', 'is-hidden');
          clearTimeout(hintTimer);
          beatSkip = function () {
            podoriSay.classList.add('is-hidden');
            tapHint.classList.add('is-hidden');
            next();
          };
        };
      }

      // 후레쉬 → 장면 정리. 여기서부터는 빨리 감지 않는다(beatSkip 을 걸지 않는다).
      function finaleBeat(next) {
        hideRatSay();
        skipBtn.classList.add('is-hidden');
        tapHint.classList.add('is-hidden');
        finale();
        setTimeout(next, 1500);
      }

      (function buildBeats() {
        // 첫 두 대사(인사 · 1단계)는 스크롤로 넘긴다 — 여기선 그 다음부터다.
        // 첫 한 바퀴는 들르는 곳마다 보따리를 눌러야 움직이고, 누를 때 보따리가 바뀐다.
        beats = [
          // 1단계 — 은행에서 달러를 챙겨 해외거래소로 (이미 달러 보따리)
          pressBeat(),
          moveBeat('dollar', SPOTS.abroad, MOVE_MS, false, true),
          // 2단계 — 달러로 코인을 사고 국내거래소로
          sayBeat('<b>2단계</b>, 해외 거래소에선<br>달러로 코인을 사야해', 2200),
          sayBeat('그런 다음 국내 거래소로 가는거지', 1700),
          pressBeat('coin'),                       // 누르면 코인 보따리로
          moveBeat('coin', SPOTS.domestic, MOVE_MS, false, true),
          // 3단계 — 국내에서 비싸게 팔고 은행으로
          sayBeat('<b>3단계</b>, 국내 거래소에선<br><span class="kimp">김프</span>만큼 코인을 비싸게 파는 거야', 2600),
          sayBeat('이제 은행으로 가볼까~', 1700),
          pressBeat('won', true),                  // 누르면 원화 보따리로 바뀌며 커진다
          holdBeat(SELL_HOLD),
          moveBeat('won', SPOTS.bank, MOVE_MS, false, true),
          // 4단계 — 은행에서 다시 환전하고, 같은 길을 반복
          sayBeat('<span class="kimp">김프</span>로 번 돈은 다시 달러로 환전!', 1700),
          sayBeat('이제 같은 걸 반복할 차례!', 1600),
          pressBeat('dollar')                      // 누르면 달러로 바뀌고 반복이 시작된다
        ].concat(lapBeats(LAPS));

        WARN_AT = beats.length;   // '건너뛰기'가 보내는 자리 — 여기부터는 못 건너뛴다
        beats = beats.concat([
          // 5단계 — 경고하고 장면을 닫는다.
          // 여기부터는 건너뛸 곳이 없으니 버튼도 치운다(눌러도 안 되는 버튼을 두지 않는다).
          function (next) {
            setSparkle(false);
            skipBtn.classList.add('is-hidden');
            next();
          },
          tapBeat('앗차차, 까먹고 안 한 말이 있네', 600),
          tapBeat('외화 유출범은 <b>형사처벌</b> 대상입니다', 600, 'podori'),
          tapBeat('절대 따라하지 마세요!', 600),
          finaleBeat
        ]);
      }());

      // 스크롤이 끝에 닿으면 '눌러서 진행하는' 이야기가 시작된다.
      // 첫 바퀴는 들르는 곳마다 보따리를 눌러야 움직인다.
      function startRatStory() {
        if (ratStarted || storyDone) return;
        ratStarted = true; ratPlaying = true;
        skipBtn.classList.remove('is-hidden');
        clearTimeout(hintTimer);
        beatIdx = -1;
        nextBeat();
      }

      // 기다리던 보따리를 눌렀다 → 멈춰 있던 박자를 이어받는다
      function pressBag() {
        if (!ratWaiting) return;
        var go = ratWaiting; ratWaiting = null;
        setSparkle(false);
        bagG.classList.remove('is-press');
        pressBtn.classList.add('is-hidden');
        tapHint.textContent = '아무 데나 눌러서 빨리 감기';
        tapHint.classList.remove('is-call');
        clearTimeout(hintTimer);
        hintTimer = setTimeout(function () { tapHint.classList.add('is-hidden'); }, 6000);
        go();
      }

      // 경고 바로 앞으로 건너뛴다.
      // 그 사이에 벌었을 만큼 보따리를 키워, 은행 앞에 세워 둔 채로 이어받는다.
      function skipToWarning() {
        if (!ratPlaying || beatIdx >= WARN_AT) return;
        beatSkip = null; beatGen++;
        hideRatSay(); podoriSay.classList.add('is-hidden');
        bagSize = 3;
        placeRat(spriteOf('dollar', 'Stand'), SPOTS.bank.x, SPOTS.bank.y);
        beatIdx = WARN_AT - 1;
        nextBeat();
      }

      // 스크롤로 넘기는 첫 두 대사. 이야기가 시작되면(ratStarted) 손을 뗀다.
      var ratScrollIdx = -2;
      function updateRatScrollSay(p) {
        var idx = -1;
        for (var i = 0; i < RAT_SAYS.length; i++) {
          if (p >= RAT_SAYS[i].from && p < RAT_SAYS[i].to) { idx = i; break; }
        }
        if (idx === ratScrollIdx) return;
        ratScrollIdx = idx;
        if (idx === -1) hideRatSay();
        else { showRatSay(RAT_SAYS[idx].html); sfx('say-rat'); }
      }

      // 스크롤을 다시 위로 올리면 처음 상태로 되돌린다 — 내려오면 다시 볼 수 있다
      function resetRatStory() {
        if (!ratStarted) return;
        ratStarted = false; ratPlaying = false; ratWaiting = null;
        ratScrollIdx = -2;
        if (window.Sound && window.Sound.music) window.Sound.music('main');
        bagG.classList.remove('is-press');
        pressBtn.classList.add('is-hidden');
        beatSkip = null; beatGen++; beatIdx = -1;
        clearTimeout(hintTimer);
        hideRatSay(); podoriSay.classList.add('is-hidden');
        podori.setAttribute('opacity', 0);
        skipBtn.classList.add('is-hidden');
        tapHint.classList.add('is-hidden'); tapHint.classList.remove('is-call');
        flash.classList.remove('is-on');
        chartWrap.classList.remove('is-cleared');
        storyDone = false;
        bagSize = 0;
        placeRat(spriteOf('dollar', 'Stand'), SPOTS.bank.x, SPOTS.bank.y);
        setSparkle(false);
      }

      // 빨리감기는 화면 어디를 눌러도 된다 — 반짝이는 보따리는 '여기'라는 표시일 뿐
      chartWrap.addEventListener('click', fastForward);
      skipBtn.addEventListener('click', function (e) { e.stopPropagation(); skipToWarning(); });
      pressBtn.addEventListener('click', function (e) { e.stopPropagation(); pressBag(); });
      // 스크롤이 잠긴 구간이라 키보드만 쓰는 사람도 반드시 빠져나갈 수 있어야 한다
      window.addEventListener('keydown', function (e) {
        if (e.target === skipBtn || e.target === pressBtn) return;
        if (e.key !== ' ' && e.key !== 'Enter' && e.key !== 'ArrowRight') return;
        if (ratWaiting) { e.preventDefault(); pressBag(); }
        else if (ratPlaying) { e.preventDefault(); fastForward(); }
      });

      // ═══════════════════════════════════════════════════════════
      // 5) 뛰는 그림 / 서 있는 그림
      // ═══════════════════════════════════════════════════════════
      var moving = false, moveTimer = null;
      function setMoving(on) {
        if (moving === on) return;
        moving = on;
        var run = currentFrog() === FROGS.run;
        FROGS.stand.el.style.display = run ? 'none' : '';
        FROGS.run.el.style.display = run ? '' : 'none';
      }
      // 뛰는 그림은 시세선 위를 실제로 이동하는 구간에서만 쓴다.
      // 끝점에 도착해 설명하는 동안에는 스크롤해도 서 있는 그림 그대로.
      var curP = 0;
      function currentFrog() {
        var running = moving && curP >= P_WALK && curP < P_EXPLAIN;
        return running ? FROGS.run : FROGS.stand;
      }

      // ═══════════════════════════════════════════════════════════
      // 6) 그리기
      // ═══════════════════════════════════════════════════════════
      // 뛰는 그림이 나오는 동안엔 김프랫처럼 발소리를 촘촘히 낸다.
      // 거리에 묶으면 스크롤 속도에 따라 들쭉날쭉해서 달리는 느낌이 안 난다.
      var STEP_GAP = 145, STEP_RATE = 1.45;
      var stepTimer = null;
      function runSteps(on) {
        if (on === !!stepTimer) return;
        if (on) {
          sfx('step', STEP_RATE);
          stepTimer = setInterval(function () { sfx('step', STEP_RATE); }, STEP_GAP);
        } else {
          clearInterval(stepTimer); stepTimer = null;
        }
      }

      var lastSayIdx = -1, swapTimer = null;
      var sayAnchor = { x: 0, y: 0 };   // 마지막으로 알아낸 김프로그 머리 위치
      var SAY_GAP = 34;   // 김치·빨간 선과 겹치지 않게 띄우는 여백(px)

      // 말풍선을 지정한 지점 위에 앉힌다.
      // 반드시 글자를 다 넣은 뒤에 부를 것 — 크기를 재서 자리를 잡기 때문이다.
      function placeSay(idx, frogX, frogTopY) {
        // 언제나 김프로그 머리 위. 화면 밖으로 나가려 하면 안쪽으로 잡아주고,
        // 그때는 꼬리 위치로 누가 말하는지 알려준다.
        var below = false;
        if (SAYS[idx].at === 'face') {   // 마지막 장면 — 우하단 얼굴
          var fx = +frogFace2.getAttribute('x'), fy = +frogFace2.getAttribute('y');
          var fw = +frogFace2.getAttribute('width'), fh = +frogFace2.getAttribute('height');
          // 좁은 화면에서는 위쪽 패널을 가리므로 얼굴 아래에 붙인다
          below = window.innerWidth <= 560;
          var anchor = toWrapPx(fx + fw / 2, below ? fy + fh : fy);
          frogX = anchor.x; frogTopY = anchor.y;
        }
        sayBox.classList.toggle('is-up', below);
        var wrapW = chartWrap.clientWidth, wrapH = chartWrap.clientHeight;
        // 크기를 재기 전에 왼쪽 끝으로 되돌린다. 오른쪽에 붙어 있는 채로 재면
        // 남은 자리만큼만 폭이 나와, 글자가 접힌 채로 조금씩 펴지게 된다.
        sayBox.style.left = '0px';
        var bw = sayBox.offsetWidth, bh = sayBox.offsetHeight;
        var left = clamp(frogX - bw / 2, 6, Math.max(6, wrapW - bw - 6));
        var wantTop = below ? frogTopY + 14 : frogTopY - bh - SAY_GAP;
        var top = clamp(wantTop, 4, Math.max(4, wrapH - bh - 4));
        sayBox.style.left = left.toFixed(0) + 'px';
        sayBox.style.top = top.toFixed(0) + 'px';
        sayBox.style.setProperty('--tail-x', clamp(frogX - left, 18, Math.max(18, bw - 18)).toFixed(0) + 'px');
      }

      function updateSay(p, frogX, frogTopY, frogScale) {
        var idx = -1;
        for (var i = 0; i < SAYS.length; i++) {
          if (p >= SAYS[i].from && p < SAYS[i].to) { idx = i; break; }
        }
        foot.classList.toggle('is-off', !(idx !== -1 && SAYS[idx].foot));
        if (idx !== lastSayIdx) {
          lastSayIdx = idx;
          sayBox.classList.add('is-hidden');
          clearTimeout(swapTimer);   // 대사 없는 구간으로 빠질 때도 예약을 반드시 지운다
          if (idx !== -1) {
            swapTimer = setTimeout(function () {
              sayText.innerHTML = SAYS[idx].html;
              placeSay(idx, sayAnchor.x, sayAnchor.y);   // 글자를 넣은 뒤에 자리를 잡는다
              sayBox.classList.remove('is-hidden');
              sfx('say-frog');
            }, 180);
          }
        }
        if (idx === -1) return;
        sayAnchor.x = frogX; sayAnchor.y = frogTopY;
        // 글자 교체를 기다리는 동안엔 옛 글자 크기로 옮기지 않는다
        if (sayBox.classList.contains('is-hidden')) return;
        placeSay(idx, frogX, frogTopY);
      }

      // SVG 좌표 → chartWrap 안쪽 픽셀 좌표
      function toWrapPx(x, y) {
        var m = svg.getScreenCTM();
        if (!m) return { x: 0, y: 0 };
        var r = chartWrap.getBoundingClientRect();
        return { x: x * m.a + y * m.c + m.e - r.left, y: x * m.b + y * m.d + m.f - r.top };
      }

      function place(x, y, frogScale, kimchiScale) {
        var frog = currentFrog();
        var off = plateOffset(frog);
        frogG.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ') scale(' + frogScale.toFixed(3) + ')');
        kimchiG.setAttribute('transform', 'translate(' + off.x.toFixed(1) + ' ' + off.y.toFixed(1) + ') scale(' + kimchiScale.toFixed(3) + ')');
      }

      function render(p) {
        curP = p;
        runSteps(currentFrog() === FROGS.run);   // 뛰는 그림일 때만 발소리
        hint.classList.toggle('is-off', p > 0.03);

        // ── 마지막 장면 전환 ──
        // 그래프·김프로그를 모두 지우고 → 김프로그 얼굴 → 거래소·은행·김프랫
        var clearing = clamp((p - P_CLEAR) / (P_FACE - P_CLEAR), 0, 1);
        world.setAttribute('opacity', (1 - clearing).toFixed(3));
        frogFace2.setAttribute('opacity', (p >= P_FACE && p < P_FACE_OUT) ? 1 : 0);
        var scene2On = p >= P_SCENE2;
        scene2.setAttribute('opacity', scene2On ? 1 : 0);
        scene2.classList.toggle('is-on', scene2On);
        // 김프로그가 사라지면 김프랫의 첫 두 대사가 스크롤을 따라 뜬다.
        // 끝에 닿아야 비로소 '눌러서 진행하는' 이야기로 넘어간다.
        if (!ratStarted) updateRatScrollSay(p);
        // 이야기 시작은 applyScrollLock 이 맡는다 — 멈춰 세우는 자리와 같은 자리라서.
        if (p < P_SCENE2) resetRatStory();
        if (p >= P_CLEAR) { updateSay(p, 0, 0, 1); return; }

        legendG.setAttribute('opacity', p >= P_EXPLAIN ? 1 : 0);
        arrowG.setAttribute('opacity', p >= P_ARROW ? 1 : 0);
        gapFill.setAttribute('opacity', p >= P_FILL ? 1 : 0);

        var x, y, frogScale, kScale;

        if (p < P_MOVE) {
          // 인사 — 가운데 크게
          axisGroup.setAttribute('opacity', 0);
          priceLine.setAttribute('opacity', 0);
          kimpLine.setAttribute('d', '');
          x = 540; y = 420; frogScale = 2.0; kScale = kimchiScaleAt(0);

        } else if (p < P_TALK) {
          // 좌표축과 시세선이 함께 뜨고, 김프로그가 시세선 시작점으로 내려간다
          var m = (p - P_MOVE) / (P_TALK - P_MOVE);
          var fade = clamp(m * 1.6, 0, 1);
          axisGroup.setAttribute('opacity', fade);
          priceLine.setAttribute('opacity', fade);
          kimpLine.setAttribute('d', '');
          x = lerp(540, startPt.x, m);
          y = lerp(420, startPt.y, m);
          frogScale = lerp(2.0, 1, m);
          kScale = kimchiScaleAt(0);

        } else if (p < P_WALK) {
          // 시작점에 멈춰 서서 말풍선 두 개
          axisGroup.setAttribute('opacity', 1);
          priceLine.setAttribute('opacity', 1);
          kimpLine.setAttribute('d', '');
          x = startPt.x; y = startPt.y; frogScale = 1; kScale = kimchiScaleAt(0);

        } else if (p < P_EXPLAIN) {
          // 해외 시세선 위를 걷는다 — 지나온 만큼 국내 시세선이 생긴다
          var t = (p - P_WALK) / (P_EXPLAIN - P_WALK);
          var pt = priceLine.getPointAtLength(priceLen * t);
          axisGroup.setAttribute('opacity', 1);
          priceLine.setAttribute('opacity', 1);
          kimpLine.setAttribute('d', kimpPathUpTo(t));
          x = pt.x; y = pt.y; frogScale = 1; kScale = kimchiScaleAt(t);

        } else {
          // 끝점에 도착해 멈춘 뒤 설명 → 김치만 더 커진다
          var endPt = priceLine.getPointAtLength(priceLen);
          axisGroup.setAttribute('opacity', 1);
          priceLine.setAttribute('opacity', 1);
          x = endPt.x; y = endPt.y; frogScale = 1;

          if (p < P_GROW) {
            kimpLine.setAttribute('d', kimpPathUpTo(1));
            kScale = kimchiScaleAt(1);
          } else {
            // 개구리 크기는 그대로, 김치만 커진다 — 빨간 선 끝이 따라 올라가고
            // 화살표도 개구리 쪽으로 옮겨가며 길어진다
            var g = clamp((p - P_GROW) / (P_GROWN - P_GROW), 0, 1);
            g = g * g * (3 - 2 * g);
            kScale = lerp(kimchiScaleAt(1), KIMCHI_BIG, g);

            var pts = grownPts(kScale);
            kimpLine.setAttribute('d', linePath(pts));
            gapFill.setAttribute('d', fillPath(pts));

            // 화살표는 x 만 미끄러지고, 위아래 끝은 '그 자리의 두 선'에 매번 맞춘다.
            // y 까지 보간하면 이동 중엔 선에서 떠 버린다.
            var nx = endPt.x - 105;   // 김프로그 왼쪽 — 커진 김치에 가리지 않는 자리
            var ax = lerp(ARROW0.x, nx, g);
            setArrow(ax, redYAt(pts, ax), priceYAt(ax));
          }
        }

        place(x, y, frogScale, kScale);

        // 말풍선 기준선 = 김프로그와 접시 위 김치 중 더 높은 쪽.
        // 김치가 커지면 머리보다 위로 솟고 빨간 선도 그 높이를 지나가므로,
        // 머리 높이만 기준으로 잡으면 말풍선이 그 위에 겹친다.
        var kimchiTop = plateOffset(currentFrog()).y - (KIMCHI_ANCHOR.y - KIMCHI_TOP) * FROG_H * kScale;
        var topLocal = Math.min(-FROG_H, kimchiTop);
        var head = toWrapPx(x, y + topLocal * frogScale);
        updateSay(p, head.x, head.y, frogScale);
      }

      // ═══════════════════════════════════════════════════════════
      // 7) 스크롤 → 진행도
      // ═══════════════════════════════════════════════════════════
      var ticking = false;

      function update() {
        var rect = scrolly.getBoundingClientRect();
        // sticky가 붙는 지점(CSS top)이 기준. getBoundingClientRect는 고정된 뒤
        // 위치를 주므로 진행도 계산에 쓰면 안 된다.
        var stickyTop = parseFloat(getComputedStyle(stage).top) || 0;
        var travel = scrolly.offsetHeight - stage.offsetHeight;
        var p = travel > 0 ? clamp((stickyTop - rect.top) / travel, 0, 1) : 0;
        render(p);
        applyScrollLock();
        ticking = false;
      }

      function onScroll() {
        setMoving(true);
        clearTimeout(moveTimer);
        moveTimer = setTimeout(function () { setMoving(false); update(); }, 160);
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(update);
      }

      // ── 김프랫 장면에서는 아래로 스크롤을 막는다 (위로는 허용) ──
      // 멈춰 세우는 자리를 '진행도 1'로 잡으면 안 된다. 스테이지는 위에서 68px 떨어져
      // 붙는데 높이는 그보다 20px 짧아서(svh-88), 진행도가 1이어도 화면 맨 아래에
      // 20px 이 남고 거기로 다음 장면 머리가 보인다.
      // 그래서 '다음 장면이 화면 밖으로 완전히 내려가는 자리'를 직접 계산해서 거기 세운다.
      var lockY = null;
      function lockPoint() {
        var next = document.getElementById('scrolly2');
        if (!next) {   // 다음 장면이 없으면 이 장면 끝에 맞춘다
          return Math.max(0, Math.round(scrolly.offsetTop + scrolly.offsetHeight - window.innerHeight));
        }
        var top = next.getBoundingClientRect().top + window.scrollY;
        return Math.max(0, Math.round(top - window.innerHeight));
      }
      // 이 자리에 닿는 순간이 곧 이야기가 시작되는 순간이다.
      // 휠 한 번에 훌쩍 지나가도 여기로 되돌려 세운다.
      function applyScrollLock() {
        if (storyDone) { lockY = null; return; }
        if (lockY === null) lockY = lockPoint();
        if (window.scrollY >= lockY) {
          if (window.scrollY > lockY) window.scrollTo(0, lockY);
          startRatStory();
        }
      }
      function ratLocking() { return ratStarted && !storyDone; }
      window.addEventListener('wheel', function (e) {
        if (ratLocking() && e.deltaY > 0) e.preventDefault();
      }, { passive: false });
      var touchY0 = 0;
      window.addEventListener('touchstart', function (e) {
        touchY0 = e.touches[0].clientY;
      }, { passive: true });
      window.addEventListener('touchmove', function (e) {
        if (ratLocking() && e.touches[0].clientY < touchY0) e.preventDefault();
      }, { passive: false });
      // 키보드로도 못 내려가게 (Space·PageDown·↓·End)
      window.addEventListener('keydown', function (e) {
        if (!ratLocking()) return;
        if (e.key === 'PageDown' || e.key === 'ArrowDown' || e.key === 'End' ||
            (e.key === ' ' && !e.shiftKey)) {
          if (e.target === skipBtn || e.target === pressBtn) return;
          e.preventDefault();
        }
      }, { passive: false });

      update();
      window.addEventListener('scroll', function () { applyScrollLock(); onScroll(); }, { passive: true });
      window.addEventListener('resize', function () { lockY = null; update(); }, { passive: true });
    })();
  </script>

  <script>
    // ══════════════════════════════════════════════════════════════
    // 두 번째 장면 — 합법 김프 투자
    //   · 규칙은 첫 장면과 같다: 개구리는 검은 선(해외 시세) 위를 걷고,
    //     접시 위 김치 크기가 김프, 빨간 선(국내 시세)은 김치 꼭대기에 붙는다.
    //   · 김프는 0(빈 접시)에서 시작해 계속 커지고, 마지막엔 김프가 높은 채로 폭락한다.
    // ══════════════════════════════════════════════════════════════
    (function () {
      var SVGNS = 'http://www.w3.org/2000/svg';
      function el(t, a) { var n = document.createElementNS(SVGNS, t); for (var k in a) n.setAttribute(k, a[k]); return n; }
      // 소리. sound.js 가 없거나 꺼져 있으면 아무 일도 일어나지 않는다.
      function sfx(name, rate) { if (window.Sound) window.Sound.play(name, rate); }
      function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
      function lerp(a, b, t) { return a + (b - a) * t; }

      var scrolly = document.getElementById('scrolly2');
      var stage = document.getElementById('stage2');
      var wrap = document.getElementById('chartWrap2');
      var svg = document.getElementById('chart2');
      var axisG = document.getElementById('axis2');
      var priceLine = document.getElementById('priceLine2');
      var kimpLine = document.getElementById('kimpLine2');
      var gapFill = document.getElementById('gapFill2');
      var frogG = document.getElementById('frog2');
      var fStand = document.getElementById('f2Stand');
      var fRun = document.getElementById('f2Run');
      var kimchiG = document.getElementById('f2KimchiG');
      var kimchiImg = document.getElementById('f2Kimchi');
      var spill = document.getElementById('f2Spill');
      var sayBox = document.getElementById('say2');
      var sayText = document.getElementById('say2Text');

      // ── 마스코트 좌표 (첫 장면과 같은 값) ──
      var PLATE = { stand: { x: 0.770, y: 0.370 }, run: { x: 0.804, y: 0.355 } };
      var KIMCHI_ANCHOR = { x: 0.40, y: 0.74 }, KIMCHI_TOP = 0.172, KIMCHI_CX = 0.504;
      var IMG_RATIO = 380 / 600;
      var FROG_W = 150, FROG_H = FROG_W * IMG_RATIO;
      var KIMCHI_MAX = 1.25;

      // ── 해외 시세: 완만히 오르다 출렁, 정점을 찍고 급락 ──
      // 출발점(y=406)이 폭락 바닥(y=528)보다 한참 위 — 원금까지 까먹은 게 보이도록
      var PRICE = [
        [120, 406], [190, 386], [255, 402], [315, 430], [375, 392],
        [440, 358], [505, 332], [565, 350], [625, 300], [685, 246],
        [742, 208], [792, 272], [842, 358], [892, 452], [935, 528]
      ];
      // 김프: 빈 접시(0)에서 시작해 계속 커지고, 폭락 중에도 높게 유지
      var KIMP = [0.00, 0.05, 0.10, 0.16, 0.24, 0.33, 0.42, 0.50, 0.60, 0.71,
                  0.80, 0.87, 0.92, 0.97, 1.00];

      // ── 구간 ──
      var P_SAY1 = 0.00, P_SAY2 = 0.24, P_WALK = 0.42, P_END = 0.90;
      // 뛰는 그림이 나오는 동안엔 김프랫처럼 발소리를 촘촘히 낸다.
      // 거리에 묶으면 스크롤 속도에 따라 들쭉날쭉해서 달리는 느낌이 안 난다.
      var STEP_GAP = 145, STEP_RATE = 1.45;
      var stepTimer = null;
      function runSteps(on) {
        if (on === !!stepTimer) return;
        if (on) {
          sfx('step', STEP_RATE);
          stepTimer = setInterval(function () { sfx('step', STEP_RATE); }, STEP_GAP);
        } else {
          clearInterval(stepTimer); stepTimer = null;
        }
      }


      var SAYS = [
        { from: P_SAY1, to: P_SAY2, html: '<span class="rat">김프랫</span>이 잡혀간 뒤로<br>난 <b>합법적인 김프 투자</b>를 연구했지, 개굴' },
        { from: P_SAY2, to: P_WALK, html: '그냥 <span class="kimp">김프</span>가 낮을 때 코인을 사서<br>높을 때 팔면 어떨까?' },
        { from: P_END,  to: 1.01,   html: '하지만 <span class="kimp">김프</span>가 높아도<br>코인이 폭락하면<br>손해였지, 개굴' }
      ];

      // ── 준비 ──
      [fStand, fRun].forEach(function (e) {
        e.setAttribute('x', -FROG_W / 2); e.setAttribute('y', -FROG_H);
        e.setAttribute('width', FROG_W); e.setAttribute('height', FROG_H);
      });
      kimchiImg.setAttribute('x', -KIMCHI_ANCHOR.x * FROG_W);
      kimchiImg.setAttribute('y', -KIMCHI_ANCHOR.y * FROG_H);
      kimchiImg.setAttribute('width', FROG_W);
      kimchiImg.setAttribute('height', FROG_H);

      function smoothPath(pts) {
        var d = 'M' + pts[0][0] + ' ' + pts[0][1];
        for (var i = 0; i < pts.length - 1; i++) {
          var a = pts[i], b = pts[i + 1];
          d += ' Q' + a[0] + ' ' + a[1] + ' ' + ((a[0] + b[0]) / 2) + ' ' + ((a[1] + b[1]) / 2);
        }
        return d + ' L' + pts[pts.length - 1][0] + ' ' + pts[pts.length - 1][1];
      }
      priceLine.setAttribute('d', smoothPath(PRICE));
      var priceLen = priceLine.getTotalLength();
      var startPt = priceLine.getPointAtLength(0);
      var endPt = priceLine.getPointAtLength(priceLen);

      function kimpAt(t) {
        var n = KIMP.length - 1, f = clamp(t, 0, 1) * n, i = Math.min(Math.floor(f), n - 1);
        return lerp(KIMP[i], KIMP[i + 1], f - i);
      }
      function kScaleAt(t) { return kimpAt(t) * KIMCHI_MAX; }      // 0이면 빈 접시
      function plateOf(run) { var p = run ? PLATE.run : PLATE.stand;
        return { x: (p.x - 0.5) * FROG_W, y: (p.y - 1) * FROG_H }; }
      function kimchiTop(s, run) {
        var o = plateOf(run);
        return { dx: o.x + (KIMCHI_CX - KIMCHI_ANCHOR.x) * FROG_W * s,
                 dy: o.y - (KIMCHI_ANCHOR.y - KIMCHI_TOP) * FROG_H * s };
      }

      // 김프가 0인 출발점에선 두 선이 딱 붙어 있어야 자연스럽다.
      // 접시 높이만큼 뜨는 것을 앞 12% 구간에서 서서히 풀어준다.
      var SAMPLES = 150, JOIN = Math.floor(SAMPLES * 0.12);
      var pricePts = [], kimpPts = [];
      for (var i = 0; i <= SAMPLES; i++) {
        var t = i / SAMPLES, pt = priceLine.getPointAtLength(priceLen * t);
        var top = kimchiTop(kScaleAt(t), false);
        var w = i >= JOIN ? 1 : (i / JOIN);
        w = w * w * (3 - 2 * w);
        pricePts.push([pt.x, pt.y]);
        kimpPts.push([pt.x + top.dx * w, pt.y + top.dy * w]);
      }
      for (var j = 1; j <= SAMPLES; j++) {
        if (kimpPts[j][0] < kimpPts[j - 1][0]) kimpPts[j][0] = kimpPts[j - 1][0];
      }
      function priceYAt(x) {
        if (x <= pricePts[0][0]) return pricePts[0][1];
        if (x >= pricePts[SAMPLES][0]) return pricePts[SAMPLES][1];
        for (var i = 1; i <= SAMPLES; i++) {
          if (pricePts[i][0] >= x) {
            var a = pricePts[i - 1], b = pricePts[i];
            return lerp(a[1], b[1], (x - a[0]) / (b[0] - a[0] || 1));
          }
        }
        return pricePts[SAMPLES][1];
      }
      function linePath(pts, upTo) {
        var last = clamp(upTo === undefined ? pts.length - 1 : upTo, 0, pts.length - 1);
        if (last < 1) return '';
        var d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
        for (var i = 1; i <= last; i++) d += ' L' + pts[i][0].toFixed(1) + ' ' + pts[i][1].toFixed(1);
        return d;
      }
      function fillPath(upTo) {
        var last = clamp(upTo, 0, SAMPLES);
        if (last < 1) return '';
        var d = linePath(kimpPts, last);
        for (var j = last; j >= 0; j--) {
          var x = kimpPts[j][0];
          d += ' L' + x.toFixed(1) + ' ' + priceYAt(x).toFixed(1);
        }
        return d + ' Z';
      }

      // ── 뛰는 그림 / 서 있는 그림 ──
      var moving = false, moveTimer = null, curP = 0;
      function running() { return moving && curP >= P_WALK && curP < P_END; }
      function place(x, y, s) {
        var run = running();
        fStand.style.display = run ? 'none' : '';
        fRun.style.display = run ? '' : 'none';
        var o = plateOf(run);
        frogG.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ')');
        kimchiG.setAttribute('transform',
          'translate(' + o.x.toFixed(1) + ' ' + o.y.toFixed(1) + ') scale(' + s.toFixed(3) + ')');
      }

      // ── 말풍선 ──
      function toWrapPx(x, y) {
        var m = svg.getScreenCTM();
        if (!m) return { x: 0, y: 0 };
        var r = wrap.getBoundingClientRect();
        return { x: x * m.a + y * m.c + m.e - r.left, y: x * m.b + y * m.d + m.f - r.top };
      }
      var lastIdx = -1, swapTimer = null;
      var sayAnchor = { x: 0, y: 0 };   // 마지막으로 알아낸 김프로그 머리 위치(SVG 좌표)

      // 첫 장면과 같은 규칙 — 글자를 다 넣은 뒤에 부를 것
      function placeSay(headX, headY) {
        var head = toWrapPx(headX, headY);
        var W = wrap.clientWidth, H = wrap.clientHeight;
        // 크기를 재기 전에 왼쪽 끝으로 되돌린다(오른쪽에 붙은 채로 재면 폭이 덜 나온다)
        sayBox.style.left = '0px';
        var bw = sayBox.offsetWidth, bh = sayBox.offsetHeight;
        var left = clamp(head.x - bw / 2, 6, Math.max(6, W - bw - 6));
        var top = clamp(head.y - bh - 30, 4, Math.max(4, H - bh - 4));
        sayBox.style.left = left.toFixed(0) + 'px';
        sayBox.style.top = top.toFixed(0) + 'px';
        sayBox.style.setProperty('--tail-x', clamp(head.x - left, 18, Math.max(18, bw - 18)).toFixed(0) + 'px');
      }

      function updateSay(p, headX, headY) {
        var idx = -1;
        for (var i = 0; i < SAYS.length; i++) if (p >= SAYS[i].from && p < SAYS[i].to) { idx = i; break; }
        if (idx !== lastIdx) {
          lastIdx = idx;
          sayBox.classList.add('is-hidden');
          clearTimeout(swapTimer);   // 대사 없는 구간으로 빠질 때도 예약을 반드시 지운다
          if (idx !== -1) {
            swapTimer = setTimeout(function () {
              sayText.innerHTML = SAYS[idx].html;
              placeSay(sayAnchor.x, sayAnchor.y);   // 글자를 넣은 뒤에 자리를 잡는다
              sayBox.classList.remove('is-hidden');
              sfx('say-frog');
            }, 170);
          }
        }
        if (idx === -1) return;
        sayAnchor.x = headX; sayAnchor.y = headY;
        if (sayBox.classList.contains('is-hidden')) return;
        placeSay(headX, headY);
      }

      // ── 그리기 ──
      var SPILL_W = 210, SPILL_H = SPILL_W / 1.363;

      function render(p) {
        curP = p;
        runSteps(running());                     // 뛰는 그림일 때만 발소리
        // 내려오기 전부터 이미 다 그려져 있어야 한다 (페이드인 없음)
        axisG.setAttribute('opacity', 1);
        priceLine.setAttribute('opacity', 1);

        var x, y, s, headX, headY;
        if (p < P_WALK) {                       // 출발 전 — 빈 접시로 서서 대사 둘
          x = startPt.x; y = startPt.y; s = kScaleAt(0);
          kimpLine.setAttribute('d', '');
          gapFill.setAttribute('opacity', 0);
          spill.setAttribute('opacity', 0);
          place(x, y, s);
        } else if (p < P_END) {                 // 선을 따라 이동 — 김치가 자란다
          var t = (p - P_WALK) / (P_END - P_WALK);
          var pt = priceLine.getPointAtLength(priceLen * t);
          s = kScaleAt(t);
          var idx = Math.floor(t * SAMPLES);
          kimpLine.setAttribute('d', linePath(kimpPts, idx));
          gapFill.setAttribute('opacity', 1);
          gapFill.setAttribute('d', fillPath(idx));
          spill.setAttribute('opacity', 0);
          x = pt.x; y = pt.y;
          place(x, y, s);
        } else {                                 // 폭락 바닥 — 접시를 엎었다
          if (spill.getAttribute('opacity') !== '1') sfx('splat');
          kimpLine.setAttribute('d', linePath(kimpPts, SAMPLES));
          gapFill.setAttribute('opacity', 1);
          gapFill.setAttribute('d', fillPath(SAMPLES));
          frogG.setAttribute('opacity', 0);
          spill.setAttribute('opacity', 1);
          spill.setAttribute('x', (endPt.x - SPILL_W * 0.62).toFixed(1));
          spill.setAttribute('y', (endPt.y - SPILL_H * 0.92).toFixed(1));
          spill.setAttribute('width', SPILL_W); spill.setAttribute('height', SPILL_H);
          x = endPt.x; y = endPt.y; s = kScaleAt(1);
        }
        if (p < P_END) frogG.setAttribute('opacity', 1);

        // 말풍선은 김치 꼭대기(또는 엎어진 개구리) 위에
        if (p < P_END) {
          var top = kimchiTop(s, running());
          headX = x; headY = y + Math.min(-FROG_H, top.dy);
        } else {
          headX = endPt.x - SPILL_W * 0.15; headY = endPt.y - SPILL_H * 0.92;
        }
        updateSay(p, headX, headY);
      }

      // ── 스크롤 ──
      var ticking = false;
      function update() {
        var rect = scrolly.getBoundingClientRect();
        var stickyTop = parseFloat(getComputedStyle(stage).top) || 0;
        var travel = scrolly.offsetHeight - stage.offsetHeight;
        render(travel > 0 ? clamp((stickyTop - rect.top) / travel, 0, 1) : 0);
        ticking = false;
      }
      function onScroll() {
        moving = true;
        clearTimeout(moveTimer);
        moveTimer = setTimeout(function () { moving = false; update(); }, 160);
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(update);
      }
      update();
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', update, { passive: true });

      // 마지막 비교 장면이 이 그래프를 축소해 다시 그린다
      window.KF = window.KF || {};
      window.KF.coin = {
        price: priceLine.getAttribute('d'),
        kimp: linePath(kimpPts, SAMPLES),
        fill: fillPath(SAMPLES),
        start: { x: startPt.x, y: startPt.y },
        end: { x: endPt.x, y: endPt.y },
        frogW: FROG_W, frogH: FROG_H,
        plate: { stand: plateOf(false), run: plateOf(true) },
        kimchiAnchor: KIMCHI_ANCHOR, kimchiMax: KIMCHI_MAX,
        spillW: SPILL_W, spillH: SPILL_H,
        // t(0~1) 시점의 김프로그 자리와 그때까지 그려진 선
        at: function (t) {
          var pt = priceLine.getPointAtLength(priceLen * clamp(t, 0, 1));
          var idx = Math.round(clamp(t, 0, 1) * SAMPLES);
          return { x: pt.x, y: pt.y, s: kScaleAt(t),
                   kimp: linePath(kimpPts, idx), fill: fillPath(idx) };
        }
      };
    })();
  </script>

  <script>
    // ══════════════════════════════════════════════════════════════
    // 세 번째 장면 — 테더에 붙는 김프
    //   · 테더는 늘 1달러라서 검은 선이 수평이다. 김프로그는 그 위를 걷는다.
    //   · 빨간 선(김프가 붙은 테더 값)은 3단계에서 처음부터 끝까지 다 그려두고,
    //     김프로그는 그 아래를 걸으며 '들고 있을 때만' 접시에 김치가 있다.
    //   · 파는 순간 김치는 머리만 있는 김프로그 옆으로 날아가 쌓인다.
    // ══════════════════════════════════════════════════════════════
    (function () {
      var SVGNS = 'http://www.w3.org/2000/svg';
      function el(t, a) { var n = document.createElementNS(SVGNS, t); for (var k in a) n.setAttribute(k, a[k]); return n; }
      // 소리. sound.js 가 없거나 꺼져 있으면 아무 일도 일어나지 않는다.
